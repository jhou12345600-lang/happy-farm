<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#79c24f;color:#3b2a14}
button{font-family:inherit;cursor:pointer;border:none}

#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(#6ec6ff 0 45%,#9ad85f 45% 100%);z-index:30}

.card{position:relative;width:100%;max-width:360px;background:#fffaf0;border:4px solid #8d5a2b;border-radius:22px;padding:22px 22px 18px;box-shadow:0 10px 0 #6b3f1d,0 18px 40px rgba(0,0,0,.25)}

.tabs{display:flex;gap:6px;margin-bottom:12px}

#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#a0703f,#7a4b24);color:#fff;border-bottom:3px solid #5a3518;flex-wrap:wrap;z-index:2}

.nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

.lv{background:#ffca28;color:#5d3a12;border-radius:8px;padding:0 6px;font-weight:900}
.xp{width:80px;height:9px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}

.btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a46a}
.badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}

#visitBar{position:absolute;left:8px;top:84px;z-index:2;background:#fff3cd;color:#7a4b24;padding:4px 6px 4px 12px;font-size:14px;font-weight:700;border:2px solid #e0c99d;border-radius:14px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.18);max-width:calc(100% - 16px)}

.ov{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:12px;color:#fff;text-shadow:0 0 3px #5d3a12,0 0 3px #5d3a12,0 0 2px #5d3a12;will-change:transform}

#tip{position:absolute;pointer-events:none;background:rgba(40,25,10,.88);color:#fff;font-size:13px;padding:7px 10px;border-radius:10px;line-height:1.5;display:none;z-index:4;white-space:nowrap}

#sceneTabs{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2;background:rgba(255,248,230,.92);padding:4px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#sceneTabs button{padding:6px 12px;border-radius:10px;background:transparent;color:#6b3f1d;font-weight:900;font-size:14px}

#hereBox{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,248,230,.92);padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#6b3f1d;box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:45%}
#chatBtn{position:absolute;right:10px;bottom:10px;z-index:2;width:52px;height:52px;border-radius:50%;background:linear-gradient(#ffcc80,#ffa726);font-size:24px;box-shadow:0 4px 0 #e68a00,0 4px 12px rgba(0,0,0,.2)}
#chatBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e68a00}
#wx{position:absolute;left:8px;top:50px;z-index:2;display:flex;gap:4px;flex-wrap:wrap;max-width:62%}
#wx button{background:rgba(255,248,230,.92);color:#6b3f1d;font-weight:700;font-size:12px;padding:3px 9px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}

.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.dex>div{background:#fff;border:2px solid #f1e2c4;border-radius:12px;padding:4px 2px;text-align:center;font-size:11px;font-weight:700;color:#5d3a12}
.dex>div.no{opacity:.5;background:#f3efe6}
.dex img{width:52px;height:52px}.dex small{color:#8d6e63;font-weight:400}
.dex .q{font-size:30px;height:52px;display:flex;align-items:center;justify-content:center}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chk label{background:#fff3d6;border:2px solid #e0c99d;border-radius:12px;padding:4px 8px;font-size:13px;font-weight:700;display:flex;gap:4px;align-items:center;color:#5d3a12}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

#tut{position:fixed;inset:0;z-index:15;pointer-events:none}
#tut.dim{background:rgba(20,12,4,.38)}
#tutRing{position:absolute;pointer-events:auto;cursor:pointer;border:4px solid #ffeb3b;border-radius:14px;box-shadow:0 0 0 4000px rgba(20,12,4,.38),0 0 18px 4px #ffeb3b;animation:tring 1.1s ease-in-out infinite;transition:left .2s,top .2s,width .2s,height .2s}

@keyframes thand{50%{transform:translateY(-8px)}}
#tutCard{pointer-events:auto;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(94vw,460px);background:#fffaf0;border:4px solid #8d5a2b;border-radius:18px;box-shadow:0 6px 0 #6b3f1d,0 10px 30px rgba(0,0,0,.35);padding:10px 12px;animation:tcin .25s ease-out}

#tutCard .th b{font-size:17px;color:#5d3a12;display:block}#tutCard .th small{font-size:12px;color:#a1887f}
#tutD{font-size:14px;line-height:1.65;color:#3b2a14}#tutD b{color:#e2553f}

#hint{position:absolute;left:10px;bottom:12px;z-index:2;font-size:11px;color:#fff;font-weight:700;text-shadow:0 0 3px #3b2a14;pointer-events:none}

#friendStrip{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:rgba(255,248,230,.97);border-top:3px solid #c9a46a;scrollbar-width:thin}
.fr{flex:none;width:68px;background:none;display:flex;flex-direction:column;align-items:center;padding:3px;border-radius:12px;color:#5d3a12}

.fn{font-size:12px;font-weight:700;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fl{font-size:11px;color:#8d6e63}
.steal{position:absolute;bottom:-6px;right:-10px;font-style:normal;font-size:11px;background:#43a047;color:#fff;border-radius:8px;padding:0 4px;border:2px solid #fff;animation:pop 1.2s ease-in-out infinite}

#tools{display:flex;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#8d5a2b,#6b3f1d);overflow-x:auto}
.tool:first-child{margin-left:auto}.tool:last-child{margin-right:auto}
.tool{flex:none;width:62px;padding:5px 2px;border-radius:14px;background:#fff3d6;color:#6b3f1d;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #c9a46a;position:relative}
.tool .ic{font-size:24px;line-height:1.1}
.tool .tl{font-size:12px;font-weight:700;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}

.tool.act{background:#c8e6c9}

.tool em.r{background:#e53935;font-size:12px;font-weight:900;border:2px solid #fff;animation:pop 1s ease-in-out infinite}
.ov.need{background:#fff;border:3px solid #e53935;border-radius:14px;padding:1px 6px;font-size:17px;text-shadow:none;color:#c62828;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;gap:3px;align-items:center}
.ov.need span{display:inline-block;animation:nb 1s ease-in-out infinite}.ov.need span:nth-child(2){animation-delay:.2s}.ov.need span:nth-child(3){animation-delay:.4s}
.ov.need small{font-size:11px;font-weight:900}
.ov.need.trash{border-color:#1e88e5;color:#1565c0}

#modal{position:fixed;inset:0;background:rgba(30,20,5,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.box{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:#fffaf0;border:4px solid #8d5a2b;border-radius:20px;box-shadow:0 8px 0 #6b3f1d;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#ffcc80,#ffb74d);font-weight:900;font-size:18px;color:#5d3a12}
.mh button{background:#fff3d6;color:#8d5a2b;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:900}
#mb{overflow-y:auto;padding:12px 14px 16px}
.mtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mtabs button{flex:1;padding:8px;border-radius:10px;background:#f1e2c4;color:#8d5a2b;font-weight:700;white-space:nowrap}

.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#fff;border:2px solid #f1e2c4;margin-bottom:8px}

.need{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.need span.ok{background:#dcedc8;color:#2e7d32}
.need span.no{background:#ffebee;color:#c62828}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4caf50)}
.b{background:linear-gradient(#7ed957,#4caf50);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:6px 10px;box-shadow:0 2px 0 #2e7d32;white-space:nowrap}
.b.o{background:linear-gradient(#ffcc80,#ffa726);box-shadow:0 2px 0 #e68a00;color:#5d3a12}
.b.r{background:linear-gradient(#ef9a9a,#e57373);box-shadow:0 2px 0 #c62828}
.b.g{background:#e0e0e0;color:#757575;box-shadow:0 2px 0 #bdbdbd}

.sq{width:64px;padding:6px 4px;border-radius:10px;border:2px solid #e0c99d;font-size:15px;font-family:inherit;text-align:center;outline:none}
.sq:focus{border-color:#ffb74d}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;padding:9px 11px;border-radius:12px;border:2px solid #e0c99d;font-size:15px;font-family:inherit;outline:none;min-width:0}
.sec{font-weight:900;color:#8d5a2b;margin:12px 0 6px;font-size:14px}
.empty{text-align:center;color:#a1887f;padding:14px;font-size:14px}
.log{padding:7px 4px;border-bottom:1px dashed #e0c99d;font-size:14px;display:flex;gap:8px;align-items:center}
.log time{color:#a1887f;font-size:12px;flex:none;width:70px}
.log.new{background:#fff3cd}
.help p{font-size:14px;line-height:1.7;margin-bottom:8px}
.help b{color:#e2553f}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.prof{display:flex;align-items:center;gap:14px;margin-bottom:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}

.stats b{display:block;font-size:17px;color:#5d3a12}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid .item{margin:0}
.gm{position:relative;width:220px;height:250px;margin:4px auto 10px}
.gm .dome{position:absolute;left:20px;top:0;width:180px;height:150px;border-radius:90px 90px 20px 20px;background:radial-gradient(circle at 35% 30%,#ffffffcc,#bbdefb88 40%,#90caf966);border:5px solid #e53935;overflow:hidden}

.cap{position:absolute;left:150px;top:196px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#ff80ab 50%,#fff 50%);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:drop .6s ease-out}

.prize{display:flex;align-items:center;gap:12px;background:linear-gradient(#fff8e1,#ffe082);border:3px solid #ffb300;border-radius:16px;padding:10px 14px;margin:8px auto;max-width:340px;animation:tin .4s ease-out}

function rollGacha(f) {
  const L = levelOf(f.exp).L, okCrops = Object.keys(CROPS).filter(k => CROPS[k].lv <= L), okSea = Object.keys(SEA).filter(k => SEA[k].lv <= L);
  const pets = f.pets.length >= PET_MAX ? [] : Object.keys(PETS).filter(k => PETS[k].lv <= L + 2 && !f.pets.includes(k)), anis = Object.keys(ANIMALS).filter(k => ANIMALS[k].lv <= L);
  const table = [['coin', 30], ['fert', 12], ['feed', 12], ['seed', 14], ['fry', okSea.length ? 12 : 0], ['exp', 10], ['ani', anis.length && f.ranch.animals.length < ranchCap(L) ? 5 : 0], ['pet', pets.length ? 3 : 0], ['big', 2]];
  let x = Math.random() * table.reduce((a, b) => a + b[1], 0), kind = 'coin'; for (const [k, w] of table) { if (x < w) { kind = k; break; } x -= w; }
  if (kind === 'coin') { const n = Math.round(100 + L * 30 + Math.random() * L * 20); f.coins += n; return {t:`💰 ${n} 金幣`, ic:'💰'}; }
  if (kind === 'big') { f.coins += 2000; return {t:'🎊 大獎！💰 2000 金幣', ic:'🎊', rare:true}; }
  if (kind === 'fert') { f.fert = (f.fert || 0) + 3; return {t:'🧪 化肥 ×3', ic:'🧪'}; }
  if (kind === 'feed') { f.feed = (f.feed || 0) + 20; return {t:'🌾 飼料 ×20', ic:'🌾'}; }
  if (kind === 'seed') { const k = rnd(okCrops); f.seeds[k] = (f.seeds[k] || 0) + 5; return {t:`🌱 ${CROPS[k].n}種子 ×5`, kind:'crop', id:k}; }
  if (kind === 'fry') { const k = rnd(okSea); f.fry[k] = (f.fry[k] || 0) + 3; return {t:`🐟 ${SEA[k].n}苗 ×3`, kind:'sea', id:k}; }
  if (kind === 'exp') { const n = 50 + L * 5; gainExp(f, n); return {t:`⭐ ${n} 經驗`, ic:'⭐'}; }
  if (kind === 'ani') { const k = rnd(anis), t = now(); f.ranch.animals.push({k, b:t, p:t, fu:t + ivMs(k) * 2, s:0, th:[]}); return {t:`🎁 免費${ANIMALS[k].n}一隻！`, kind:'ani', id:k, rare:true}; }
  const k = rnd(pets); f.pets.push(k); if (!f.pet) f.pet = k; return {t:`🐾 稀有寵物：${PETS[k].n}！`, kind:'pet', id:k, rare:true};
}

  if (!Object.keys(plan).length) return toast('倉庫裡沒有這張合作訂單需要的東西');

      <div class="grid" style="grid-template-columns:1fr 1fr">${[['boy', '👦 男生', '草帽小農夫'], ['girl', '👧 女生', '黃色毛帽小農夫']].map(([k, t, d]) => `<div class="item" style="flex-direction:column;text-align:center;${g === k ? 'border-color:#43a047;background:#f1f8e9' : ''}"><div class="pic" style="width:110px;height:110px"><img src="${thumbURL('char', k)}" style="width:110px;height:110px" alt=""></div><div class="t">${t}</div><div class="d">${d}</div><button class="b ${g === k ? 'g' : 'o'}" data-act="setGender" data-g="${k}" ${g === k ? 'disabled' : ''}>${g === k ? '使用中' : '選這個'}</button></div>`).join('')}</div>`); };
  S.modal(); S.charFirst = !!first;
}
function watchHere() {
  S.unsubHere && S.unsubHere(); S.here = S.here.filter(p => p.uid === S.uid).map(p => ({...p, at:S.viewUid, t:now()})); S.hereIds = new Set(); S.hereInit = false; const at = S.viewUid;
  S.unsubHere = B.watchHere(at, list => {
    if (S.viewUid !== at) return;
    const fresh = list.filter(p => !p.off && p.t && now() - p.t < 75000);
    if (at === S.uid && S.hereInit) for (const p of fresh) if (p.uid !== S.uid && !S.hereIds.has(p.uid)) toast(`👋 ${p.n} 來你家玩了！`);
    S.hereIds = new Set(fresh.map(p => p.uid)); S.hereInit = true; S.here = list; renderScene();
  });
}
function cleanup() { for (const k of ['unsubMy', 'unsubView', 'unsubHere']) { S[k] && S[k](); S[k] = null; } }
async function onAuth(u) {
  cleanup(); closeModal();
  if (!u) { S.uid = S.my = S.view = S.viewUid = null; S.friends = []; S.reqs = []; S.gifts = []; S.giftsInit = false; $('#game').hidden = true; $('#auth').hidden = false; $('#aPass').value = ''; $('#aPass2').value = ''; return; }
  S.uid = u.uid;
  await sleep(0); if (B.settle) await B.settle();
  let f = null; for (let k = 0; k < 8 && !(f = await B.getFarm(u.uid).catch(() => null)); k++) await sleep(400);
  let rebuilt = false;
  if (!f && await B.rebuildFarm(u.uid).catch(e => { console.warn(e); return false; })) { f = await B.getFarm(u.uid).catch(() => null); rebuilt = !!f; }
  if (!f) { $('#authErr').textContent = '讀取農場失敗，請再試一次'; await B.logout(); return; }
  S.my = normalize(f); S.seed = null; S.tool = 'hand'; S.scene = 'farm';
  $('#auth').hidden = true; $('#game').hidden = false;
  if (!W.scene) { try { init3D(); } catch (e) { console.error(e); $('#loading').textContent = '😢 你的瀏覽器無法顯示 3D（需要 WebGL），請換 Chrome 或 Safari 試試'; } }
  else setCam('farm', true);
  S.unsubMy = B.watch(S.uid, nf => {
    if (!nf) return; S.my = normalize(nf); if (isOwn()) S.view = S.my;
    const key = (nf.friends || []).join(','); if (key !== S.lastFriendKey) { S.lastFriendKey = key; refreshFriends(); }
    renderAll(); rerenderModal();
  });
  goHome();
  const isNew = !f.lastSign;
  setTimeout(() => { if (!S.my || S.uid !== u.uid) return; if (!S.my.gender) openChar(true); else { greet(isNew); if (typeof S.my.tut === 'number') setTimeout(() => startTut(S.my.tut), 5600); } }, 2200);
  const r = await txMe(g => { let ch = false; if (g.lastSign !== today()) { g.lastSign = today(); g.coins += SIGN_COINS; daily(g); ch = true; } if (fillOrders(g)) ch = true; return ch ? {} : ab(''); }).catch(() => ({abort:1}));
  if (rebuilt) toast('🌱 你的農場資料不見了，已經幫你重新建好一座新農場');
  else if (!r.abort && f.lastSign !== today()) toast(isNew ? '🎉 歡迎來到 3D 農場！' : `☀️ 每日簽到 +${SIGN_COINS} 金幣，記得看看今天的任務和訂單 📋`);
  refreshFriends();
}
function goHome() { unZoom(); S.unsubView && S.unsubView(); S.unsubView = null; S.viewUid = S.uid; S.view = S.my; S.tool = 'hand'; renderAll(); beat(); watchHere(); }
function visit(uid) {
  if (uid === S.uid) return goHome();
  unZoom(); S.unsubView && S.unsubView();
  S.viewUid = uid; const fr = S.friends.find(x => x.uid === uid); S.view = fr ? fr.farm : null; S.tool = 'hand'; renderAll(); beat(); watchHere();
  setTimeout(() => { if (S.viewUid === uid) waveAt(uid, fr ? dn(fr.farm) : '', false, true); }, 1200);
  S.unsubView = B.watch(uid, nf => { if (S.viewUid !== uid) return; if (!nf) { toast('找不到這個農場'); return goHome(); } S.view = normalize(nf); const fr2 = S.friends.find(x => x.uid === uid); if (fr2) fr2.farm = S.view; renderScene(); renderTools(); });
  if (!dailyView(S.my).vis.includes(uid)) txMe(f => { const d = daily(f); if (d.vis.includes(uid)) return ab(''); d.vis.push(uid); bump(f, 'visit'); return {}; }).catch(() => {});
}
function resetSceneKeys() { if (!W.scene) return; W.plots.forEach(P => P.key = null); W.ponds.forEach(P => P.key = null); W.machs.forEach(P => { P.key = null; P.indKey = null; }); W.aniKey = null; W.petKey = null; }

setInterval(() => { if (S.view) { renderScene(); renderTools(); } renderWx(); }, 1000);
setInterval(() => {
  if (!S.view || document.hidden || !Music.wanted || !Music.on) return;
  Music.amb(isRain() ? 'rain' : '');
  if (S.scene === 'ranch') { const list = S.view.ranch.animals; if (list.length && Math.random() < .5) Music.voice(rnd(list).k); }
  else if (isNight()) { if (Math.random() < .5) Music.cricket(); }
  else if (!isRain() && Math.random() < .45) Music.chirp();
  if (Math.random() < .08 && S.view.pets?.length) Music.voice(PETS[rnd(S.view.pets)]?.kind || 'dog');
}, 3200);
setInterval(async () => { if (!S.my || S.busy) return; if (tickOwn(normalize(clone(S.my)))) { const msgs = []; try { await txMe(f => { msgs.length = 0; return tickOwn(f, msgs) ? {} : ab(''); }); msgs.forEach(m => toast(m)); } catch {} } }, 5000);
setInterval(() => { if (S.my) beat(); }, 25000);
setInterval(() => { if (S.my) refreshFriends(); }, 20000);
setInterval(() => { if (S.my) { renderStrip(); renderTop(); } }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.my) beat(); });

(async () => {
  try { B = USE_FB ? await makeFirebase(FIREBASE_CONFIG) : makeLocal(); }
  catch (e) { $('#authErr').textContent = '無法連上伺服器：' + e.message; return; }
  $('#modeNote').innerHTML = B.mode === 'local' ? '⚠️ 目前是<b>單機測試模式</b>：帳號只存在這台裝置。' : '🌐 連線模式：朋友可以用自己的手機登入一起玩';
  $('#aGo').disabled = false; $('#aGo').textContent = authMode === 'reg' ? '註冊並開始' : '開始種田';
  B.onAuth(u => onAuth(u).catch(e => { console.error(e); toast('出錯了：' + e.message); }));
})();
</script>
