<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>歡樂偷菜農場</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#79c24f;color:#3b2a14}
button{font-family:inherit;cursor:pointer;border:none}
[hidden]{display:none!important}

/* ===== 登入畫面 ===== */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(#6ec6ff 0 45%,#9ad85f 45% 100%)}
#auth::before{content:"";position:absolute;left:-10%;right:-10%;top:38%;height:18%;background:#7cc35a;border-radius:50% 50% 0 0}
.card{position:relative;width:100%;max-width:360px;background:#fffaf0;border:4px solid #8d5a2b;border-radius:22px;padding:22px 22px 18px;box-shadow:0 10px 0 #6b3f1d,0 18px 40px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:14px}
.logo .big{font-size:40px;line-height:1}
.logo h1{font-size:26px;color:#e2553f;letter-spacing:2px;text-shadow:2px 2px 0 #ffe0a3;margin-top:6px}
.logo p{font-size:13px;color:#8d6e63;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:12px;background:#f1e2c4;color:#8d5a2b;font-weight:700;font-size:15px}
.tabs button.on{background:#ffb74d;color:#5d3a12;box-shadow:inset 0 -3px 0 #e69a2e}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:700;color:#8d5a2b;margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:2px solid #e0c99d;background:#fff;font-size:16px;font-family:inherit;outline:none}
.field input:focus{border-color:#ffb74d}
.go{width:100%;padding:12px;border-radius:14px;background:linear-gradient(#7ed957,#4caf50);color:#fff;font-size:18px;font-weight:900;letter-spacing:2px;box-shadow:0 4px 0 #2e7d32;margin-top:4px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #2e7d32}
.go:disabled{opacity:.6}
#authErr{color:#d32f2f;font-size:14px;min-height:20px;text-align:center;margin-top:8px;font-weight:700}
#modeNote{font-size:12px;color:#8d6e63;text-align:center;margin-top:6px;line-height:1.5}

/* ===== 遊戲 ===== */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#a0703f,#7a4b24);color:#fff;border-bottom:3px solid #5a3518;flex-wrap:wrap;z-index:2}
.me{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;background:none;color:#fff;text-align:left}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;border:3px solid #fff;flex:none;position:relative;background:#ff9800;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.nm small{font-size:11px;opacity:.8;font-weight:400}
.lvRow{display:flex;align-items:center;gap:5px;font-size:12px}
.lv{background:#ffca28;color:#5d3a12;border-radius:8px;padding:0 6px;font-weight:900}
.xp{width:80px;height:9px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#cddc39);width:0}
.xpt{opacity:.85}
.coins{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 10px;font-size:15px;white-space:nowrap}
.coins b{color:#ffe082}
.btns{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.btns button{position:relative;background:#fff3d6;color:#6b3f1d;border-radius:12px;padding:6px 9px;font-size:14px;font-weight:700;box-shadow:0 3px 0 #c9a46a;display:flex;align-items:center;gap:3px}
.btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a46a}
.badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.badge.on{display:flex}
#visitBar{background:#fff3cd;color:#7a4b24;text-align:center;padding:6px;font-size:14px;font-weight:700;border-bottom:2px solid #e0c99d;display:flex;align-items:center;justify-content:center;gap:10px}
#visitBar button{background:#4caf50;color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;box-shadow:0 2px 0 #2e7d32}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:#79c24f}
#scene{width:100%;height:100%;display:block;overflow:visible;touch-action:manipulation}
#tip{position:absolute;pointer-events:none;background:rgba(40,25,10,.88);color:#fff;font-size:13px;padding:7px 10px;border-radius:10px;line-height:1.5;display:none;z-index:3;white-space:nowrap}
#tip b{color:#ffe082}
#sceneTabs{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2;background:rgba(255,248,230,.9);padding:4px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#sceneTabs button{padding:6px 12px;border-radius:10px;background:transparent;color:#6b3f1d;font-weight:900;font-size:14px}
#sceneTabs button.on{background:#ffb74d;color:#5d3a12}
#hereBox{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,248,230,.9);padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#6b3f1d;box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:45%}
#chatBtn{position:absolute;right:10px;bottom:10px;z-index:2;width:52px;height:52px;border-radius:50%;background:linear-gradient(#ffcc80,#ffa726);font-size:24px;box-shadow:0 4px 0 #e68a00,0 4px 12px rgba(0,0,0,.2)}
#chatBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e68a00}

#friendStrip{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:rgba(255,248,230,.95);border-top:3px solid #c9a46a;scrollbar-width:thin}
.fr{flex:none;width:68px;background:none;display:flex;flex-direction:column;align-items:center;padding:3px;border-radius:12px;color:#5d3a12}
.fr.on{background:#ffe0a3}
.fr .av{width:42px;height:42px;border-color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.fr.add .av{background:#bdbdbd}
.fn{font-size:12px;font-weight:700;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fl{font-size:11px;color:#8d6e63}
.steal{position:absolute;bottom:-6px;right:-10px;font-style:normal;font-size:11px;background:#43a047;color:#fff;border-radius:8px;padding:0 4px;border:2px solid #fff;animation:pop 1.2s ease-in-out infinite}
.dot{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:#4caf50;border:2px solid #fff}
@keyframes pop{50%{transform:scale(1.15)}}

#tools{display:flex;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#8d5a2b,#6b3f1d);overflow-x:auto}
.tool:first-child{margin-left:auto}.tool:last-child{margin-right:auto}
.tool{flex:none;width:62px;padding:5px 2px;border-radius:14px;background:#fff3d6;color:#6b3f1d;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #c9a46a;position:relative}
.tool .ic{font-size:24px;line-height:1.1}
.tool .tl{font-size:12px;font-weight:700;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}
.tool.on{background:#ffca28;box-shadow:0 3px 0 #e69a2e,0 0 0 3px #fff}
.tool.act{background:#c8e6c9}
.tool em{position:absolute;top:-5px;right:-4px;font-style:normal;font-size:11px;background:#6d4c41;color:#fff;border-radius:8px;padding:0 5px}

/* SVG */
.tile,.ani,.poop,.trough{cursor:pointer}
.tile .top{transition:filter .15s}
.tile:hover .top{filter:brightness(1.12);stroke:#ffe14d;stroke-width:3}
.tile.locked{cursor:default}
.tile.locked:hover .top{filter:none;stroke:none}
.ani:hover>g{filter:brightness(1.08) drop-shadow(0 0 4px #fff59d)}
.buyTxt{font-size:15px;font-weight:900;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#2e7d32;stroke-width:4px}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(1600px)}}
.tw{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-15deg)}to{transform:rotate(20deg)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.walk{animation:walk 3.4s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.fx{font-size:20px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;animation:fx 1.5s ease-out forwards;pointer-events:none}
@keyframes fx{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-55px)}}
.signT{font-size:17px;font-weight:900;fill:#fff8e1;text-anchor:middle}
.pname{font-size:12px;font-weight:900;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#5d3a12;stroke-width:3.5px}
.bubT{font-size:13px;font-weight:700;text-anchor:middle;fill:#3b2a14}
.cnt{font-size:11px;font-weight:900;fill:#fff;text-anchor:middle}

/* ===== 視窗 ===== */
#modal{position:fixed;inset:0;background:rgba(30,20,5,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.box{width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;background:#fffaf0;border:4px solid #8d5a2b;border-radius:20px;box-shadow:0 8px 0 #6b3f1d;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#ffcc80,#ffb74d);font-weight:900;font-size:18px;color:#5d3a12}
.mh button{background:#fff3d6;color:#8d5a2b;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:900}
#mb{overflow-y:auto;padding:12px 14px 16px}
.mtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mtabs button{flex:1;padding:8px;border-radius:10px;background:#f1e2c4;color:#8d5a2b;font-weight:700;white-space:nowrap}
.mtabs button.on{background:#ffb74d;color:#5d3a12}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#fff;border:2px solid #f1e2c4;margin-bottom:8px}
.item.dim{opacity:.55}
.item.done{border-color:#a5d6a7;background:#f1f8e9}
.item .pic{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:#f6ecd6;border-radius:12px;font-size:30px;overflow:hidden}
.item .info{flex:1;min-width:0}
.item .t{font-weight:900;font-size:15px}
.item .d{font-size:12px;color:#8d6e63;line-height:1.5}
.item .acts{display:flex;flex-direction:column;gap:4px;flex:none}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4caf50)}
.b{background:linear-gradient(#7ed957,#4caf50);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:6px 10px;box-shadow:0 2px 0 #2e7d32;white-space:nowrap}
.b.o{background:linear-gradient(#ffcc80,#ffa726);box-shadow:0 2px 0 #e68a00;color:#5d3a12}
.b.r{background:linear-gradient(#ef9a9a,#e57373);box-shadow:0 2px 0 #c62828}
.b.g{background:#e0e0e0;color:#757575;box-shadow:0 2px 0 #bdbdbd}
.b:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;padding:9px 11px;border-radius:12px;border:2px solid #e0c99d;font-size:15px;font-family:inherit;outline:none;min-width:0}
.sec{font-weight:900;color:#8d5a2b;margin:12px 0 6px;font-size:14px}
.empty{text-align:center;color:#a1887f;padding:14px;font-size:14px}
.log{padding:7px 4px;border-bottom:1px dashed #e0c99d;font-size:14px;display:flex;gap:8px;align-items:center}
.log time{color:#a1887f;font-size:12px;flex:none;width:70px}
.log.new{background:#fff3cd}
.help p{font-size:14px;line-height:1.7;margin-bottom:8px}
.help b{color:#e2553f}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.phr button{background:#fff3d6;border:2px solid #e0c99d;border-radius:14px;padding:6px 10px;font-size:14px;color:#5d3a12;font-weight:700}
.wheelWrap{position:relative;width:240px;height:240px;margin:6px auto 10px}
.wheelWrap svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.17,.67,.2,1)}
.wheelPin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #e53935;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));z-index:1}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.prof .av{width:64px;height:64px;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stats div{background:#fff;border:2px solid #f1e2c4;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:#8d6e63}
.stats b{display:block;font-size:17px;color:#5d3a12}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(40,25,10,.9);color:#fff;padding:9px 16px;border-radius:14px;font-size:15px;font-weight:700;animation:tin .25s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

@media (max-width:640px){
  .btns button span{display:none}
  .btns button{padding:6px 7px;font-size:16px}
  .xp{width:56px}
  .xpt{display:none}
  #top{gap:6px}
  .tool{width:49px}
  .tool .ic{font-size:20px}
  .tool .tl{font-size:11px}
  #tools{gap:4px;padding-left:4px;padding-right:4px}
  .fr{width:58px}
  .fr .av{width:36px;height:36px;font-size:15px}
  #sceneTabs button{padding:5px 9px;font-size:13px}
  #chatBtn{width:46px;height:46px;font-size:21px}
}
</style>
</head>
<body>

<!-- 登入 / 註冊 -->
<div id="auth">
  <div class="card">
    <div class="logo"><div class="big">🥕🐔🌽🐷🍅</div><h1>歡樂偷菜農場</h1><p>種菜、養動物、半夜去好友家偷菜！</p></div>
    <div class="tabs"><button class="on" data-act="authTab" data-t="login">登入</button><button data-act="authTab" data-t="reg">註冊新帳號</button></div>
    <form id="authForm" autocomplete="on">
      <div class="field"><label>帳號（2～10 個字，可用中文）</label><input id="aName" autocomplete="username" maxlength="10" required></div>
      <div class="field"><label>密碼（至少 6 個字）</label><input id="aPass" type="password" autocomplete="current-password" required></div>
      <div class="field" id="aPass2Wrap" hidden><label>再輸入一次密碼</label><input id="aPass2" type="password" autocomplete="new-password"></div>
      <button class="go" id="aGo" type="submit">開始種田</button>
    </form>
    <div id="authErr"></div>
    <div id="modeNote"></div>
  </div>
</div>

<!-- 遊戲 -->
<div id="game" hidden>
  <header id="top">
    <button class="me" data-act="profile"><div class="av" id="myAv"></div><div><div class="nm" id="myName"></div>
      <div class="lvRow"><span class="lv" id="myLv"></span><div class="xp"><i id="myXp"></i></div><span class="xpt" id="myXpT"></span></div></div></button>
    <div class="coins">💰 <b id="myCoins">0</b></div>
    <div class="btns">
      <button data-act="tasks">📋<span>任務</span><em class="badge" id="bdT"></em></button>
      <button data-act="shop">🏪<span>商店</span></button>
      <button data-act="wh">📦<span>倉庫</span></button>
      <button data-act="friends">👥<span>好友</span><em class="badge" id="bdF"></em></button>
      <button data-act="msgs">📜<span>消息</span><em class="badge" id="bdM"></em></button>
      <button data-act="help">❓<span>玩法</span></button>
      <button data-act="logout">🚪<span>登出</span></button>
    </div>
  </header>
  <div id="visitBar" hidden><span>你正在 <b id="visitName"></b> 的家 👀</span><button data-act="home">🏠 回家</button></div>
  <div id="stage">
    <svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
      <g id="bgG"></g><g id="decoG"></g><g id="plotsG"></g><g id="peopleG"></g><g id="fxG"></g>
    </svg>
    <div id="sceneTabs"><button data-act="scene" data-s="farm" class="on">🌾 農場</button><button data-act="scene" data-s="ranch">🐮 牧場</button></div>
    <div id="hereBox" hidden></div>
    <button id="chatBtn" data-act="chat" title="說話">💬</button>
    <div id="tip"></div>
  </div>
  <div id="friendStrip"></div>
  <nav id="tools"></nav>
</div>

<div id="modal" hidden><div class="box"><div class="mh"><span id="mt"></span><button data-act="close">✕</button></div><div id="mb"></div></div></div>
<div id="toast"></div>

}

/* 雜草、蟲、乾旱、便便：主人上線時補算 */
function tickOwn(f) {
  let ch = false; const t = now(); const cat = petOf(f) === 'cat';
  for (let i = 0; i < f.plotCount; i++) {
    const p = f.plots[i]; if (p.s !== 'grow') continue;
    const g = totalMs(p), iv = Math.max(15000 / SPEED, g / 4), end = Math.min(t, p.p + g);
    const k = Math.floor((end - p.p) / iv), done = p.k || 0;
    if (k > done) {
      for (let j = done; j < k; j++) {
        if (Math.random() < 0.35 && probs(p) < 3) {
          const opts = p.d ? ['w', 'b'] : ['d', 'w', 'b']; const o = opts[Math.floor(Math.random() * opts.length)];
          if (o === 'b' && cat && Math.random() < 0.6) continue;
          if (o === 'd') p.d = true; else p[o] = (p[o] || 0) + 1;
        }
      }
      p.k = k; ch = true;
    }
  }
  const r = f.ranch;
  if (r && r.animals.length && t - (r.pt || 0) > 15 * 60000 / SPEED) {
    r.pt = t; ch = true;
    if (r.poop < MAX_POOP && Math.random() < 0.3 + 0.06 * r.animals.length) r.poop++;
  }
  return ch;
}

function makeLocal() {
  const K = 'hf_local_db', SK = 'hf_local_sess', PK = 'hf_local_pres';
  const load = () => { let d; try { d = JSON.parse(store.getItem(K)) || {}; } catch { d = {}; } d.users ??= {}; d.names ??= {}; d.farms ??= {}; d.req ??= {}; return d; };
  const loadP = () => { try { return JSON.parse(store.getItem(PK)) || {}; } catch { return {}; } };
  let db = load(); const watchers = new Set(), pw = new Set(); let authCb = null;
  const save = () => { store.setItem(K, JSON.stringify(db)); notify(); };
  function notify() { for (const w of watchers) { const s = JSON.stringify(db.farms[w.uid] ?? null); if (s !== w.last) { w.last = s; w.cb(JSON.parse(s)); } } }
  function notifyP() { const p = loadP(); for (const w of pw) w.cb(Object.entries(p).filter(([, v]) => v.at === w.at).map(([uid, v]) => ({uid, ...v}))); }
  addEventListener('storage', e => { if (e.key === K) { db = load(); notify(); } if (e.key === PK) notifyP(); });
  return {
    mode:'local',
    onAuth(cb) { authCb = cb; const u = store.getItem(SK); cb(u && db.users[u] ? {uid:u} : null); },
    async register(name, pass) {
      db = load(); const k = nameKey(name); if (db.names[k]) throw new Error('這個帳號已經有人用了');
      const uid = 'u' + Math.random().toString(36).slice(2, 10);
      db.users[uid] = {pass:await sha(pass)}; db.names[k] = uid; db.farms[uid] = newFarm(name.trim()); save();
      store.setItem(SK, uid); authCb({uid});
    },
    async login(name, pass) {
      db = load(); const uid = db.names[nameKey(name)]; if (!uid) throw new Error('帳號不存在');
      if (db.users[uid].pass !== await sha(pass)) throw new Error('密碼錯誤'); store.setItem(SK, uid); authCb({uid});
    },
    async logout() { store.removeItem(SK); authCb(null); },
    async findUid(name) { db = load(); return db.names[nameKey(name)] || null; },
    async getFarm(uid) { db = load(); return db.farms[uid] ? clone(db.farms[uid]) : null; },
    watch(uid, cb) { const w = {uid, cb, last:undefined}; watchers.add(w); setTimeout(notify, 0); return () => watchers.delete(w); },
    async tx(uid, fn) {
      db = load(); const f = db.farms[uid]; if (!f) throw new Error('找不到農場');
      const c = normalize(clone(f)); const r = fn(c) || {}; if (r.abort) return r; db.farms[uid] = c; save(); return r;
    },
    async sendReq(from, fromName, to) { db = load(); db.req[to + '_' + from] = {from, fromName, to, t:now()}; save(); },
    async listReq(uid) { db = load(); return Object.entries(db.req).filter(([, r]) => r.to === uid).map(([id, r]) => ({id, ...r})); },
    async delReq(id) { db = load(); delete db.req[id]; save(); },
    async setPresence(uid, d) { const p = loadP(); p[uid] = {...(p[uid] || {}), ...d}; store.setItem(PK, JSON.stringify(p)); notifyP(); },
    watchHere(at, cb) { const w = {at, cb}; pw.add(w); setTimeout(notifyP, 0); return () => pw.delete(w); },
    async listRecent() { return Object.entries(loadP()).map(([uid, v]) => ({uid, ...v})).sort((a, b) => b.t - a.t).slice(0, 40); },
    async getPresence(uid) { return loadP()[uid] || null; },
  };
}

/* ===================== 後台：Firebase 連線版 ===================== */
async function makeFirebase(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg); const auth = A.getAuth(app);
  const db = F.initializeFirestore(app, {ignoreUndefinedProperties:true, ...(new URLSearchParams(location.search).has('lp') ? {experimentalForceLongPolling:true} : {})});
  const email = name => 'u' + hex(nameKey(name)) + '@hfarm.game';
  const fref = uid => F.doc(db, 'farms', uid);
  const MSG = {'auth/invalid-credential':'帳號或密碼錯誤', 'auth/wrong-password':'帳號或密碼錯誤', 'auth/user-not-found':'帳號不存在',
    'auth/invalid-login-credentials':'帳號或密碼錯誤', 'auth/email-already-in-use':'這個帳號已經有人用了', 'auth/weak-password':'密碼至少要 6 個字',
    'auth/too-many-requests':'嘗試太多次，請稍後再試', 'auth/network-request-failed':'網路連線失敗',
    'auth/operation-not-allowed':'Firebase 還沒開啟「電子郵件/密碼」登入', 'permission-denied':'資料庫拒絕存取（請檢查 Firestore 規則）'};
  const wrap = e => new Error(MSG[e.code] || e.message);
  let regP = null;
  return {
    mode:'firebase',
    async settle() { if (regP) await regP.catch(() => {}); },
    async register(name, pass) { regP = this._register(name, pass); try { await regP; } finally { regP = null; } },
    async _register(name, pass) {
      try {
        const k = nameKey(name);
        if ((await F.getDoc(F.doc(db, 'usernames', k))).exists()) throw new Error('這個帳號已經有人用了');
        const cred = await A.createUserWithEmailAndPassword(auth, email(name), pass);
        try { await F.setDoc(F.doc(db, 'usernames', k), {uid:cred.user.uid}); }
        catch (e) { await cred.user.delete().catch(() => {}); throw new Error('這個帳號已經有人用了'); }
        await F.setDoc(fref(cred.user.uid), newFarm(name.trim()));
      } catch (e) { throw e.code ? wrap(e) : e; }
    },
    async login(name, pass) { try { await A.signInWithEmailAndPassword(auth, email(name), pass); } catch (e) { throw wrap(e); } },
    async logout() { await A.signOut(auth); },
    async findUid(name) { const s = await F.getDoc(F.doc(db, 'usernames', nameKey(name))); return s.exists() ? s.data().uid : null; },
    async getFarm(uid) { const s = await F.getDoc(fref(uid)); return s.exists() ? s.data() : null; },
    watch(uid, cb) { return F.onSnapshot(fref(uid), s => cb(s.exists() ? s.data() : null), e => console.warn(e)); },
    async tx(uid, fn) {
      try {
        return await F.runTransaction(db, async t => {
          const s = await t.get(fref(uid)); if (!s.exists()) throw new Error('找不到農場');
          const base = normalize(clone(s.data())), c = clone(base); const r = fn(c) || {}; if (r.abort) return r;
          const ch = {}; for (const k of Object.keys(c)) if (JSON.stringify(c[k]) !== JSON.stringify(base[k])) ch[k] = c[k];
          if (Object.keys(ch).length) t.update(fref(uid), ch); return r;
        });
      } catch (e) { throw e.code ? wrap(e) : e; }
    },
    async sendReq(from, fromName, to) { await F.setDoc(F.doc(db, 'requests', to + '_' + from), {from, fromName, to, t:now()}); },
    async listReq(uid) { const q = await F.getDocs(F.query(F.collection(db, 'requests'), F.where('to', '==', uid))); return q.docs.map(d => ({id:d.id, ...d.data()})); },
    async delReq(id) { await F.deleteDoc(F.doc(db, 'requests', id)); },
    async setPresence(uid, d) { await F.setDoc(F.doc(db, 'presence', uid), d, {merge:true}).catch(e => console.warn(e)); },
    watchHere(at, cb) { return F.onSnapshot(F.query(F.collection(db, 'presence'), F.where('at', '==', at)), s => cb(s.docs.map(d => ({uid:d.id, ...d.data()}))), e => console.warn(e)); },
    async listRecent() { const q = await F.getDocs(F.query(F.collection(db, 'presence'), F.orderBy('t', 'desc'), F.limit(40))); return q.docs.map(d => ({uid:d.id, ...d.data()})); },
    async getPresence(uid) { const s = await F.getDoc(F.doc(db, 'presence', uid)); return s.exists() ? s.data() : null; },
  };
}

  if (isHungry(a)) t += '🍽️ 肚子餓了，不會生產';
  else if (v.s >= MAX_STOCK) t += '產品滿了，快收走';
  else t += `下一個${PROD[A.prod].n}：${fmtDur(v.p + ivMs(a.k) - now())}<br>飽足還有 ${fmtDur(a.fu - now())}`;
  return t;
}
function tipFor(h) {
  if (h.type === 'tile') return plotText(h.i);
  if (h.type === 'ani') return aniText(h.i);
  if (h.type === 'poop') return '💩 便便！點一下清掉' + (isOwn() ? '（+1 經驗）' : '（幫忙 +2 經驗）');
  if (h.type === 'trough') return isOwn() ? `<b>飼料槽</b><br>牧草 ${S.my.wh.grass || 0}、飼料 ${S.my.feed || 0}<br>點一下幫肚子快餓的動物餵食` : '飼料槽';
  return '';
}
function hitOf(t) {
  let e;
  if ((e = t.closest('.tile'))) return {type:'tile', i:+e.dataset.i};
  if ((e = t.closest('.ani'))) return {type:'ani', i:+e.dataset.a};
  if ((e = t.closest('.poop'))) return {type:'poop', i:+e.dataset.p};
  if (t.closest('.trough')) return {type:'trough'};
  return null;
}
function showTip(h) { const tip = $('#tip'); tip.innerHTML = tipFor(h); tip.style.display = tip.innerHTML ? 'block' : 'none'; }
$('#scene').addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const h = hitOf(e.target); const tip = $('#tip');
  if (!h) { S.hover = null; tip.style.display = 'none'; return; }
  S.hover = h; showTip(h);
  const r = $('#stage').getBoundingClientRect(); let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 6) x = e.clientX - r.left - tip.offsetWidth - 10;
  if (y + tip.offsetHeight > r.height - 6) y = e.clientY - r.top - tip.offsetHeight - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
$('#scene').addEventListener('pointerleave', () => { S.hover = null; $('#tip').style.display = 'none'; });
$('#scene').addEventListener('click', e => { const h = hitOf(e.target); if (h) clickHit(h); });

/* ===================== 點擊 ===================== */
const plain = h => tipFor(h).replace(/<br>/g, '，').replace(/<[^>]+>/g, '');
async function run(fn) {
  if (S.busy) return; S.busy = true;
  try { await fn(); } catch (e) { console.error(e); toast('出錯了：' + e.message); } finally { S.busy = false; }
}
function clickHit(h) {
  if (!S.view) return;
  if (h.type === 'tile') return clickPlot(h.i);
  if (h.type === 'ani') return run(() => clickAnimal(h.i));
  if (h.type === 'poop') return run(() => cleanPoop(h.i));
  if (h.type === 'trough') return isOwn() ? run(feedAll) : toast('這是好友的飼料槽');
}
function smartTool(p, own) {
  if (own) { if (p.s === 'dead') return 'plow'; if (p.s === 'empty') return 'plant'; if (isMature(p)) return 'harvest'; }
  else if (isMature(p)) { const si = stealInfo(p, S.uid); if (si.can) return 'steal'; }
  if (p.s === 'grow') { if (p.d) return 'water'; if (p.w) return 'weed'; if (p.b) return 'bug'; }
  return null;
}
function clickPlot(i) {
  const f = S.view, own = isOwn();
  if (i >= f.plotCount) { if (own && i === f.plotCount) run(buyPlot); return; }
  let tool = S.tool; if (tool === 'hand') tool = smartTool(f.plots[i], own);
  if (!tool) return toast(plain({type:'tile', i}));
  run(() => ACT_PLOT[tool](i));
}
const txMe = fn => B.tx(S.uid, fn);
const txView = fn => B.tx(S.viewUid, fn);
const ab = msg => ({abort:1, msg});
function biteCheck(f, nm) { const pk = petOf(f); if (pk && PETS[pk].bite && Math.random() < PETS[pk].bite) { addLog(f, `🐶 你的${PETS[pk].n}咬了來偷東西的 ${nm}！`); return 30 + Math.floor(Math.random() * 51); } return 0; }
async function bitten(x, y, fine, pk) {
  const g = await txMe(f => { const lost = Math.min(f.coins, fine); f.coins -= lost; return {lost}; });
  floatAt(x, y, '🐶 汪汪！', '#d32f2f'); toast(`被${pk || '看門狗'}咬了！掉了 ${g.lost} 金幣 😭`);
}

const ACT_PLOT = {
  async harvest(i) {
    const r = await txMe(f => {
      const p = f.plots[i]; if (!isMature(p)) return ab('還沒成熟');
      const c = CROPS[p.c], amt = harvestAmt(p);
      f.wh[p.c] = (f.wh[p.c] || 0) + amt; const up = gainExp(f, c.exp); f.plots[i] = {s:'dead', c:p.c}; bump(f, 'harvest');
      return {amt, c:p.c, exp:c.exp, up};
    });
    if (r.abort) return toast(r.msg);
    float(i, `+${r.amt} ${CROPS[r.c].n}`); float(i, `+${r.exp} 經驗`, '#f57c00', 22); lvToast(r.up);
  },
  async plow(i) {
    const p = S.view.plots[i];
    if (p.s === 'empty') return toast('這塊地是空的，可以直接播種');
    if (p.s === 'grow' && !confirm(`確定要把還在長的${CROPS[p.c].n}剷掉嗎？`)) return;
    const r = await txMe(f => { if (f.plots[i].s === 'empty') return ab('已經是空地了'); const wasDead = f.plots[i].s === 'dead'; f.plots[i] = {s:'empty'}; return {up:wasDead ? gainExp(f, 1) : 0, wasDead}; });
    if (r.abort) return toast(r.msg);
    float(i, r.wasDead ? '+1 經驗' : '剷掉了', '#f57c00'); lvToast(r.up);
  },
  async plant(i) {
    const id = S.seed; if (!id) return openSeedPicker(i);
    const c = CROPS[id];
    const r = await txMe(f => {
      const p = f.plots[i];
      if (p.s === 'dead') return ab('先用 ⛏️ 翻地才能播種'); if (p.s !== 'empty') return ab('這塊地已經種東西了');
      if (levelOf(f.exp).L < c.lv) return ab(`Lv.${c.lv} 才能種${c.n}`);
      let bought = false;
      if ((f.seeds[id] || 0) > 0) f.seeds[id]--; else if (f.coins >= c.cost) { f.coins -= c.cost; bought = true; } else return ab(`金幣不夠買${c.n}種子`);
      f.plots[i] = {s:'grow', c:id, p:now(), w:0, b:0, d:false, st:0, th:[], k:0, f:0}; bump(f, 'plant');
      return {bought};
    });
    if (r.abort) return toast(r.msg);
    float(i, r.bought ? `🌱 -${c.cost}💰` : '🌱 播種', '#558b2f');
  },
  async fert(i) {
    const r = await txMe(f => {
      const p = f.plots[i]; if (p.s !== 'grow') return ab('這塊地沒有作物'); if (isMature(p)) return ab('已經成熟了，直接收成吧');
      if (p.f) return ab('這一季已經施過肥了'); if (!f.fert) return ab('沒有化肥了，去商店買吧');
      f.fert--; p.f = Math.round(Math.min(matureAt(p) - now(), growMs(p.c) * 0.3)); return {saved:p.f};
    });
    if (r.abort) return toast(r.msg);
    float(i, `🧪 快了 ${fmtDur(r.saved)}`, '#7b1fa2');
  },
  water(i) { return fix(i, 'd'); }, weed(i) { return fix(i, 'w'); }, bug(i) { return fix(i, 'b'); },
  pbug(i) { return prank(i, 'b'); }, pweed(i) { return prank(i, 'w'); },
  async steal(i) {
    const me = S.uid, nm = myName();
    const r = await txView(f => {
      const p = f.plots[i], si = stealInfo(p, me);
      if (!si) return ab('還沒成熟，不能偷');
      if (!si.can) return ab(si.mine ? '這塊你已經偷過了' : '剩下的不能再偷了，留一點給人家吧');
      p.th = [...(p.th || []), me];
      const bite = biteCheck(f, nm); if (bite) return {bitten:bite, pk:PETS[petOf(f)].n};
      const n = Math.min(si.avail, 1 + Math.floor(Math.random() * 3)); p.st = (p.st || 0) + n;
      addLog(f, `🥷 ${nm} 偷走了你 ${n} 個${CROPS[p.c].n}`); return {n, c:p.c};
    });
    if (r.abort) return toast(r.msg);
    const {x, y} = tilePos(i);
    if (r.bitten) return bitten(x, y, r.bitten, r.pk);
    await txMe(f => { f.wh[r.c] = (f.wh[r.c] || 0) + r.n; bump(f, 'steal'); return {}; });
    float(i, `🥷 +${r.n} ${CROPS[r.c].n}`);
  },
};
const FIX = {d:['澆水', '不用澆水'], w:['除草', '沒有雜草'], b:['除蟲', '沒有蟲']};
async function helpReward() {
  return txMe(f => { const d = daily(f); const e = d.help < DAILY_HELP_EXP ? 2 : 0; d.help += e; f.coins += 1; bump(f, 'help'); return {e, up:e ? gainExp(f, e) : 0}; });
}
async function fix(i, key) {
  const [label, none] = FIX[key], nm = myName();
  const doFix = p => { if (!p || p.s !== 'grow' || !p[key]) return false; if (key === 'd') p.d = false; else p[key]--; return true; };
  if (isOwn()) {
    const r = await txMe(f => doFix(f.plots[i]) ? {up:gainExp(f, 1)} : ab(none));
    if (r.abort) return toast(r.msg); float(i, `${label} +1 經驗`, '#0277bd'); lvToast(r.up); return;
  }
  const r = await txView(f => { if (!doFix(f.plots[i])) return ab(none); addLog(f, `🤝 ${nm} 幫你${label}`); return {}; });
  if (r.abort) return toast(r.msg);
  const g = await helpReward();
  float(i, g.e ? `幫忙${label} +2 經驗` : `幫忙${label} +1💰`, '#0277bd'); lvToast(g.up);
}
async function prank(i, key) {
  if (dailyView(S.my).prank >= DAILY_PRANK) return toast('今天的惡作劇次數用完了，明天再來 😈');
  const nm = myName();
  const r = await txView(f => {
    const p = f.plots[i]; if (!p || p.s !== 'grow') return ab('這塊地沒有作物');
    if (isMature(p)) return ab('已經成熟了，放了也沒用'); if (probs(p) >= 3) return ab('這塊地已經夠慘了，放過它吧');
    p[key] = (p[key] || 0) + 1; addLog(f, key === 'b' ? `🐛 ${nm} 在你的田裡放了蟲` : `🌾 ${nm} 在你的田裡種了雜草`); return {};
  });
  if (r.abort) return toast(r.msg);
  await txMe(f => { daily(f).prank++; return {}; });
  float(i, key === 'b' ? '🐛 嘿嘿' : '🌾 嘿嘿', '#6a1b9a');
}

/* ----- 牧場動作 ----- */
async function clickAnimal(i) {
  const a = S.view.ranch.animals[i]; if (!a) return;
  if (isOwn()) {
    const v = aView(a);
    if (!v.s) { if (isHungry(a) || needFeed(a)) return feedAll(); return toast(plain({type:'ani', i})); }
    const r = await txMe(f => {
      const x = f.ranch.animals[i]; if (!x) return ab('找不到這隻動物'); settleA(x); if (!x.s) return ab('還沒有產品');
      const A = ANIMALS[x.k], n = x.s; f.wh[A.prod] = (f.wh[A.prod] || 0) + n; x.s = 0; x.th = [];
      const up = gainExp(f, A.exp * n); bump(f, 'collect', n); return {n, prod:A.prod, e:A.exp * n, up};
    });
    if (r.abort) return toast(r.msg);
    floatA(i, `+${r.n} ${PROD[r.prod].n}`); floatA(i, `+${r.e} 經驗`, '#f57c00', 22); lvToast(r.up); return;
  }
  if (!aStealable(a, S.uid)) return toast(plain({type:'ani', i}));
  const me = S.uid, nm = myName();
  const r = await txView(f => {
    const x = f.ranch.animals[i]; if (!x) return ab('找不到這隻動物'); settleA(x);
    if ((x.th || []).includes(me)) return ab('這隻你已經偷過了'); if (x.s < 2) return ab('剩太少了，留一點給人家吧');
    x.th = [...(x.th || []), me];
    const bite = biteCheck(f, nm); if (bite) return {bitten:bite, pk:PETS[petOf(f)].n};
    x.s--; const A = ANIMALS[x.k]; addLog(f, `🥷 ${nm} 偷走了你的${A.n}生的 1 個${PROD[A.prod].n}`); return {prod:A.prod};
  });
  if (r.abort) return toast(r.msg);
  const {x, y} = aniPos(i);
  if (r.bitten) return bitten(x, y, r.bitten, r.pk);
  await txMe(f => { f.wh[r.prod] = (f.wh[r.prod] || 0) + 1; bump(f, 'steal'); return {}; });
  floatA(i, `🥷 +1 ${PROD[r.prod].n}`);
}
async function feedAll() {
  if (!isOwn()) return toast('只能餵自己的動物');
  const r = await txMe(f => {
    const list = f.ranch.animals; if (!list.length) return ab('還沒有動物，去商店買吧');
    let fed = 0, used = 0; const t = now();
    for (const a of list) {
      if (!needFeed(a)) continue;
      const eat = ANIMALS[a.k].eat;
      if ((f.wh.grass || 0) + (f.feed || 0) < eat) { if (!fed) return ab(`飼料不夠了（${ANIMALS[a.k].n}要吃 ${eat} 份）。種牧草或去商店買飼料吧`); break; }
      for (let k = 0; k < eat; k++) { if (f.wh.grass > 0) f.wh.grass--; else f.feed--; }
      settleA(a, t); if (a.fu < t) { const part = Math.max(0, a.fu - a.p); a.p = t - part; a.fu = t; }
      a.fu += ivMs(a.k) * 2; fed++; used += eat;
    }
    if (!fed) return ab('大家都吃很飽，晚點再餵 😋');
    bump(f, 'feed'); const up = gainExp(f, fed); return {fed, used, up};
  });
  if (r.abort) return toast(r.msg);
  floatAt(690, 300, `🌾 餵了 ${r.fed} 隻（用掉 ${r.used} 份）`, '#8d6e63'); lvToast(r.up);
}
async function cleanPoop(k) {
  if (isOwn()) {
    const r = await txMe(f => { if (!(f.ranch.poop > 0)) return ab('已經很乾淨了'); f.ranch.poop--; f.coins += 1; bump(f, 'clean'); return {up:gainExp(f, 1)}; });
    if (r.abort) return toast(r.msg); floatAt(...POOP_POS[k], '🧹 +1 經驗', '#6d4c41'); lvToast(r.up); return;
  }
  const nm = myName();
  const r = await txView(f => { if (!(f.ranch.poop > 0)) return ab('已經很乾淨了'); f.ranch.poop--; addLog(f, `🧹 ${nm} 幫你清了便便`); return {}; });
  if (r.abort) return toast(r.msg);
  const g = await helpReward(); await txMe(f => { bump(f, 'clean'); return {}; });
  floatAt(...POOP_POS[k], g.e ? '🧹 幫忙 +2 經驗' : '🧹 幫忙 +1💰', '#6d4c41'); lvToast(g.up);
}

function wheelSVG() {
  const R = 100; let s = '';
  WHEEL.forEach((w, i) => {
    const a0 = (i * 45 - 90) * Math.PI / 180, a1 = ((i + 1) * 45 - 90) * Math.PI / 180, am = (i * 45 + 22.5 - 90);
    s += `<path d="M0 0L${R * Math.cos(a0)} ${R * Math.sin(a0)}A${R} ${R} 0 0 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)}Z" fill="${w.col}" stroke="#fff" stroke-width="2"/>`;
    s += `<text transform="rotate(${am}) translate(64 0) rotate(90)" text-anchor="middle" font-size="12" font-weight="900" fill="#5d3a12" dy="4">${w.t}</text>`;
  });
  return `<svg id="wheel" viewBox="-105 -105 210 210"><circle r="104" fill="#8d5a2b"/>${s}<circle r="16" fill="#fff3d6" stroke="#8d5a2b" stroke-width="3"/><text text-anchor="middle" dy="5" font-size="13">🎁</text></svg>`;
}
function openTasks() {
  S.modal = () => {

    let body = `<div class="sec" style="margin-top:0">🎡 每日幸運轉盤</div><div class="wheelWrap"><div class="wheelPin"></div>${wheelSVG()}</div>
      <div style="text-align:center;margin-bottom:8px">${d.spin ? '<button class="b g" disabled>今天轉過了，明天再來</button>' : '<button class="b o" style="font-size:16px;padding:8px 22px" data-act="spin">免費轉一次！</button>'}</div>`;
    body += `<div class="sec">📋 今日任務（每天更新）</div>`;
    body += keys.map(k => {
      const T = TASKS[k], prog = Math.min(T.need, d.t[k] || 0), done = prog >= T.need, cl = d.cl.includes(k);
      return `<div class="item ${cl ? 'done' : ''}"><div class="info"><div class="t">${T.n}</div><div class="d">獎勵 ${T.c}💰 + ${T.e} 經驗 · 進度 ${prog}/${T.need}</div><div class="bar"><i style="width:${prog / T.need * 100}%"></i></div></div>
        <div class="acts">${cl ? '<button class="b g" disabled>已領取</button>' : done ? `<button class="b o" data-act="claim" data-k="${k}">領取</button>` : '<button class="b g" disabled>進行中</button>'}</div></div>`;
    }).join('');
    body += `<div class="item ${d.bonus ? 'done' : ''}"><div class="pic">🎁</div><div class="info"><div class="t">全部完成大獎</div><div class="d">完成並領取 5 個任務：100💰 + 化肥×2 + 飼料×10</div></div>

async function doSpin() {
  const r = await txMe(f => {
    const d = daily(f); if (d.spin) return ab('今天轉過了');
    d.spin = true; let x = Math.random() * WHEEL.reduce((s, w) => s + w.w, 0), idx = 0;
    while (x >= WHEEL[idx].w) { x -= WHEEL[idx].w; idx++; }
    const w = WHEEL[idx]; let up = 0, msg = w.t;
    if (w.c) f.coins += w.c; if (w.fert) f.fert = (f.fert || 0) + w.fert; if (w.feed) f.feed = (f.feed || 0) + w.feed; if (w.e) up = gainExp(f, w.e);
    if (w.seed) { const ok = Object.keys(CROPS).filter(k => CROPS[k].lv <= levelOf(f.exp).L); const k = ok[Math.floor(Math.random() * ok.length)]; f.seeds[k] = (f.seeds[k] || 0) + w.seed; msg = `${CROPS[k].n}種子 ×${w.seed}`; }
    return {idx, msg, up};
  });
  if (r.abort) return toast(r.msg);
  const wheel = $('#wheel'); if (wheel) wheel.style.transform = `rotate(${360 * 6 - (r.idx * 45 + 22.5)}deg)`;
  const keep = S.modal; S.modal = null;
  await sleep(3300); toast(`🎉 轉到了：${r.msg}！`); lvToast(r.up); S.modal = keep; rerenderModal();
}

  async claim(d) {
    const T = TASKS[d.k];
    const r = await txMe(f => { const dd = daily(f); if (dd.cl.includes(d.k)) return ab('已經領過了'); if ((dd.t[d.k] || 0) < T.need) return ab('還沒完成'); dd.cl.push(d.k); f.coins += T.c; return {up:gainExp(f, T.e)}; });
    if (r.abort) return toast(r.msg); toast(`✅ 領取任務獎勵：${T.c} 金幣 + ${T.e} 經驗`); lvToast(r.up);
  },
  async claimBonus() {
    const r = await txMe(f => { const dd = daily(f); if (dd.bonus) return ab('已經領過了'); if (dd.cl.length < 5) return ab('還有任務沒完成'); dd.bonus = true; f.coins += 100; f.fert = (f.fert || 0) + 2; f.feed = (f.feed || 0) + 10; return {}; });
    toast(r.abort ? r.msg : '🎁 大獎到手：100 金幣、化肥×2、飼料×10！');
  },
  async saveNick() {
    const v = ($('#nickIn')?.value || '').trim();
    if ([...v].length > 10) return toast('名字最多 10 個字');
    if (/[<>]/.test(v)) return toast('名字不能有 < 或 >');
    await txMe(f => { f.nick = v; return {}; });
    beat(); toast(v ? `名字改成「${v}」了！` : '已改回用帳號當名字');
  },
  async logout() { if (!confirm('確定要登出嗎？')) return; await B.setPresence(S.uid, {t:0, at:''}); await B.logout(); },
  home() { closeModal(); goHome(); },
  visit(d) { closeModal(); visit(d.uid); },
  async pickSeed(d) {
    const c = CROPS[d.id]; if (!(S.my.seeds[d.id] > 0) && S.my.coins < c.cost) return toast(`金幣不夠買${c.n}種子`);
    S.seed = d.id; S.tool = 'plant'; closeModal(); renderTools();
    const i = S.pendingPlot; S.pendingPlot = -1;
    if (i >= 0 && isOwn() && S.scene === 'farm') clickPlot(i); else toast(`已選擇${c.n}，點空地播種`);
  },
  async buySeed(d) {
    const c = CROPS[d.id], n = +d.n;
    const r = await txMe(f => { if (f.coins < c.cost * n) return ab('金幣不夠'); f.coins -= c.cost * n; f.seeds[d.id] = (f.seeds[d.id] || 0) + n; return {}; });
    toast(r.abort ? r.msg : `買了 ${n} 包${c.n}種子`);
  },
  async buyFert(d) { const n = +d.n; const r = await txMe(f => { if (f.coins < FERT_PRICE * n) return ab('金幣不夠'); f.coins -= FERT_PRICE * n; f.fert = (f.fert || 0) + n; return {}; }); toast(r.abort ? r.msg : `買了 ${n} 包化肥`); },
  async buyFeed(d) { const n = +d.n; const r = await txMe(f => { if (f.coins < FEED_PRICE * n) return ab('金幣不夠'); f.coins -= FEED_PRICE * n; f.feed = (f.feed || 0) + n; return {}; }); toast(r.abort ? r.msg : `買了 ${n} 份飼料`); },
  async buyAnimal(d) {
    const A = ANIMALS[d.k];
    const r = await txMe(f => {
      const Lv = levelOf(f.exp).L; if (Lv < A.lv) return ab(`Lv.${A.lv} 才能養${A.n}`);
      if (f.ranch.animals.length >= ranchCap(Lv)) return ab('牧場滿了，升級可以養更多');
      if (f.coins < A.price) return ab('金幣不夠');
      const t = now(); f.coins -= A.price; f.ranch.animals.push({k:d.k, b:t, p:t, fu:t + ivMs(d.k) * 2, s:0, th:[]}); return {};
    });
    if (r.abort) return toast(r.msg);
    toast(`🐣 ${A.n}來到你的牧場了！記得餵牠吃東西`); closeModal();
    if (!isOwn()) goHome();
    S.scene = 'ranch'; renderAll();
  },
  async sellAnimal(d) {
    const i = +d.i, a = S.my.ranch.animals[i]; if (!a) return;
    if (!confirm(`確定要賣掉${ANIMALS[a.k].n}嗎？（拿回 ${Math.floor(ANIMALS[a.k].price / 2)} 金幣，牠身上的產品會一起收進倉庫）`)) return;
    const r = await txMe(f => {
      const x = f.ranch.animals[i]; if (!x || x.k !== a.k || x.b !== a.b) return ab('動物清單變了，請再試一次');
      settleA(x); const A = ANIMALS[x.k]; if (x.s) f.wh[A.prod] = (f.wh[A.prod] || 0) + x.s;
      f.ranch.animals.splice(i, 1); f.coins += Math.floor(A.price / 2); return {};
    });
    toast(r.abort ? r.msg : '已賣掉，掰掰 👋');
  },
  async buyPet(d) {
    const P = PETS[d.k];
    if (!confirm(`花 ${P.price} 金幣買一隻${P.n}？`)) return;
    const r = await txMe(f => { if (f.pets.includes(d.k)) return ab('已經有了'); if (levelOf(f.exp).L < P.lv) return ab(`Lv.${P.lv} 才能買`); if (f.coins < P.price) return ab('金幣不夠'); f.coins -= P.price; f.pets.push(d.k); f.pet = d.k; return {}; });
    toast(r.abort ? r.msg : `🐾 ${P.n}來到你家了，已經在顧家囉！`);
  },
  async setPet(d) { await txMe(f => { if (!f.pets.includes(d.k)) return ab('還沒有這隻寵物'); f.pet = d.k; return {}; }); toast(`${PETS[d.k].n}出來顧家了！`); },
  buyPlot() { return run(buyPlot); },
  async sell(d) {
    const r = await txMe(f => { const n = f.wh[d.id] || 0; if (!n) return ab('沒有可以賣的'); const g = n * itemInfo(d.id).sell; f.coins += g; f.wh[d.id] = 0; bump(f, 'sell'); return {n, g}; });
    toast(r.abort ? r.msg : `賣出 ${r.n} 個${itemInfo(d.id).n}，賺了 ${r.g} 金幣 💰`);
  },
  async sellAll() {
    const r = await txMe(f => { let g = 0; for (const [id, n] of Object.entries(f.wh || {})) { if (id === 'grass' || !n) continue; g += n * itemInfo(id).sell; f.wh[id] = 0; } if (!g) return ab('沒有可以賣的'); bump(f, 'sell'); return {g}; });
    toast(r.abort ? r.msg : `全部賣出，賺了 ${r.g} 金幣 💰`);
  },
  async sellProducts() {
    const r = await txMe(f => { let g = 0; for (const id of Object.keys(PROD)) { const n = f.wh[id] || 0; if (n) { g += n * PROD[id].sell; f.wh[id] = 0; } } if (!g) return ab('倉庫裡沒有動物產品'); bump(f, 'sell'); return {g}; });
    toast(r.abort ? r.msg : `動物產品全部賣出，賺了 ${r.g} 金幣 💰`);
  },
  addFriend,
  async addUid(d) { await sendFriendReq(d.uid, d.n); },
  async accept(d) { const r = S.reqs.find(x => x.id === d.id); if (r) await acceptReq(r); },
  async reject(d) { await B.delReq(d.id); toast('已拒絕'); await refreshFriends(); },
  async unfriend(d) {
    const x = S.friends.find(y => y.uid === d.uid); if (!confirm(`確定要刪除好友 ${x ? dn(x.farm) : ''}？`)) return;
    await txMe(f => { f.friends = (f.friends || []).filter(u => u !== d.uid); return {}; });
    await B.tx(d.uid, f => { f.friends = (f.friends || []).filter(u => u !== S.uid); return {}; }).catch(() => {});
    if (S.viewUid === d.uid) goHome(); toast('已刪除好友'); await refreshFriends();
  },
  say(d) { return say(d.m); },
  sayIn() { return say($('#sayIn')?.value); },
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn || el.disabled) return;
  try { await fn(el.dataset, el); } catch (err) { console.error(err); toast('出錯了：' + err.message); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'fName') addFriend();
  if (e.key === 'Enter' && e.target.id === 'sayIn') say(e.target.value);
  if (e.key === 'Enter' && e.target.id === 'nickIn') ACT.saveNick();
  if (e.key === 'Escape') closeModal();
});

/* ===================== 登入流程 ===================== */
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#aName').value.trim(), pass = $('#aPass').value, err = $('#authErr');
  err.textContent = '';
  if (!/^[A-Za-z0-9_㐀-鿿]{2,10}$/.test(name)) return err.textContent = '帳號要 2～10 個字，只能用中英文、數字或底線';
  if (pass.length < 6) return err.textContent = '密碼至少要 6 個字';
  if (authMode === 'reg' && pass !== $('#aPass2').value) return err.textContent = '兩次輸入的密碼不一樣';
  $('#aGo').disabled = true;
  try { authMode === 'reg' ? await B.register(name, pass) : await B.login(name, pass); }
  catch (ex) { err.textContent = ex.message; }
  finally { $('#aGo').disabled = false; }
});

function beat() { if (S.my && S.uid) B.setPresence(S.uid, {n:myName(), lv:levelOf(S.my.exp).L, at:S.viewUid || S.uid, t:now()}); }
function watchHere() {
  S.unsubHere && S.unsubHere(); S.here = []; S.hereIds = new Set(); S.hereInit = false; const at = S.viewUid;
  S.unsubHere = B.watchHere(at, list => {
    if (S.viewUid !== at) return;
    const fresh = list.filter(p => p.t && now() - p.t < 75000);
    if (at === S.uid) for (const p of fresh) if (p.uid !== S.uid && !S.hereIds.has(p.uid) && S.hereInit) toast(`👋 ${p.n} 來你家玩了！`);
    S.hereIds = new Set(fresh.map(p => p.uid)); S.hereInit = true;
    S.here = list; renderPeople();
  });
}
function cleanup() { for (const k of ['unsubMy', 'unsubView', 'unsubHere']) { S[k] && S[k](); S[k] = null; } }
async function onAuth(u) {
  cleanup(); closeModal();
  if (!u) { S.uid = S.my = S.view = S.viewUid = null; S.friends = []; S.reqs = []; $('#game').hidden = true; $('#auth').hidden = false; $('#aPass').value = ''; $('#aPass2').value = ''; return; }
  S.uid = u.uid;
  await sleep(0); if (B.settle) await B.settle();
  let f = null; for (let k = 0; k < 20 && !(f = await B.getFarm(u.uid).catch(() => null)); k++) await sleep(400);
  if (!f) { $('#authErr').textContent = '讀取農場失敗，請再試一次'; await B.logout(); return; }
  S.my = normalize(f); S.seed = null; S.tool = 'hand'; S.scene = 'farm';
  $('#auth').hidden = true; $('#game').hidden = false; fitView();
  S.unsubMy = B.watch(S.uid, nf => {
    if (!nf) return; S.my = normalize(nf); if (isOwn()) S.view = S.my;
    const key = (nf.friends || []).join(','); if (key !== S.lastFriendKey) { S.lastFriendKey = key; refreshFriends(); }
    renderAll(); rerenderModal();
  });
  goHome();
  const isNew = !f.lastSign;
  const r = await txMe(g => {
    let ch = false;
    if (g.lastSign !== today()) { g.lastSign = today(); g.coins += SIGN_COINS; daily(g); ch = true; }
    return ch ? {signed:true} : ab('');
  }).catch(() => ({abort:1}));
  if (!r.abort) toast(isNew ? '🎉 歡迎來到農場！先種白蘿蔔和牧草試試看，左上角可以改名字' : `☀️ 每日簽到 +${SIGN_COINS} 金幣，記得看看今天的任務 📋`);
  refreshFriends();
}
function goHome() {
  S.unsubView && S.unsubView(); S.unsubView = null;
  S.viewUid = S.uid; S.view = S.my; S.tool = 'hand'; renderAll(); beat(); watchHere();
}
function visit(uid) {
  if (uid === S.uid) return goHome();
  S.unsubView && S.unsubView();
  S.viewUid = uid; const fr = S.friends.find(x => x.uid === uid); S.view = fr ? fr.farm : null; S.tool = 'hand'; renderAll(); beat(); watchHere();
  S.unsubView = B.watch(uid, nf => { if (S.viewUid !== uid) return; S.view = normalize(nf); if (!nf) { toast('找不到這個農場'); return goHome(); } renderScene(); renderTools(); });
  if (!dailyView(S.my).vis.includes(uid)) txMe(f => { const d = daily(f); if (d.vis.includes(uid)) return ab(''); d.vis.push(uid); bump(f, 'visit'); return {}; }).catch(() => {});
}

/* 定時更新 */
setInterval(() => { if (S.view) renderScene(); }, 1000);
setInterval(async () => {
  if (!S.my || S.busy) return;
  if (tickOwn(normalize(clone(S.my)))) { try { await txMe(f => tickOwn(f) ? {} : ab('')); } catch {} }
}, 5000);
setInterval(() => { if (S.my) beat(); }, 25000);
setInterval(() => { if (S.my) refreshFriends(); }, 20000);
setInterval(() => { if (S.my) { renderStrip(); renderTop(); } }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.my) beat(); });

/* ===================== 啟動 ===================== */
$('#bgG').innerHTML = bgSVG();
(async () => {
  try { B = USE_FB ? await makeFirebase(FIREBASE_CONFIG) : makeLocal(); }
  catch (e) { $('#authErr').textContent = '無法連上伺服器：' + e.message; return; }
  $('#modeNote').innerHTML = B.mode === 'local' ? '⚠️ 目前是<b>單機測試模式</b>：帳號只存在這台裝置。' : '🌐 連線模式：朋友可以用自己的手機登入一起玩';
  B.onAuth(u => onAuth(u).catch(e => { console.error(e); toast('出錯了：' + e.message); }));
})();
</script>
</body>
</html>
