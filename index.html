<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>歡樂偷菜農場 3D</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:#79c24f;color:#3b2a14}
button{font-family:inherit;cursor:pointer;border:none}
[hidden]{display:none!important}

#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(#6ec6ff 0 45%,#9ad85f 45% 100%);z-index:30}
#auth::before{content:"";position:absolute;left:-10%;right:-10%;top:38%;height:18%;background:#7cc35a;border-radius:50% 50% 0 0}
.card{position:relative;width:100%;max-width:360px;background:#fffaf0;border:4px solid #8d5a2b;border-radius:22px;padding:22px 22px 18px;box-shadow:0 10px 0 #6b3f1d,0 18px 40px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:14px}
.logo .big{font-size:38px;line-height:1}
.logo h1{font-size:26px;color:#e2553f;letter-spacing:2px;text-shadow:2px 2px 0 #ffe0a3;margin-top:6px}
.logo p{font-size:13px;color:#8d6e63;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:12px;background:#f1e2c4;color:#8d5a2b;font-weight:700;font-size:15px}
.tabs button.on{background:#ffb74d;color:#5d3a12;box-shadow:inset 0 -3px 0 #e69a2e}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;font-weight:700;color:#8d5a2b;margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:2px solid #e0c99d;background:#fff;font-size:16px;font-family:inherit;outline:none}
.field input:focus{border-color:#ffb74d}
.go{width:100%;padding:12px;border-radius:14px;background:linear-gradient(#7ed957,#4caf50);color:#fff;font-size:18px;font-weight:900;letter-spacing:2px;box-shadow:0 4px 0 #2e7d32;margin-top:4px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #2e7d32}
.go:disabled{opacity:.6}
#authErr{color:#d32f2f;font-size:14px;min-height:20px;text-align:center;margin-top:8px;font-weight:700}
#modeNote{font-size:12px;color:#8d6e63;text-align:center;margin-top:6px;line-height:1.5}

#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#a0703f,#7a4b24);color:#fff;border-bottom:3px solid #5a3518;flex-wrap:wrap;z-index:2}
.me{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;background:none;color:#fff;text-align:left}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;border:3px solid #fff;flex:none;position:relative;background:#ff9800;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.nm small{font-size:11px;opacity:.8;font-weight:400}
.lvRow{display:flex;align-items:center;gap:5px;font-size:12px}
.lv{background:#ffca28;color:#5d3a12;border-radius:8px;padding:0 6px;font-weight:900}
.xp{width:80px;height:9px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#cddc39);width:0}
.xpt{opacity:.85}
.coins{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 10px;font-size:15px;white-space:nowrap}
.coins b{color:#ffe082}
.btns{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.btns button{position:relative;background:#fff3d6;color:#6b3f1d;border-radius:12px;padding:6px 8px;font-size:14px;font-weight:700;box-shadow:0 3px 0 #c9a46a;display:flex;align-items:center;gap:3px}
.btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a46a}
.badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.badge.on{display:flex}
#visitBar{background:#fff3cd;color:#7a4b24;text-align:center;padding:6px;font-size:14px;font-weight:700;border-bottom:2px solid #e0c99d;display:flex;align-items:center;justify-content:center;gap:10px}
#visitBar button{background:#4caf50;color:#fff;border-radius:10px;padding:4px 12px;font-weight:700;box-shadow:0 2px 0 #2e7d32}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;background:#9fd8ff}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:900;color:#5d3a12;background:linear-gradient(#bfe6ff,#9ad85f);z-index:3;font-size:16px}
#ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.ov{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:12px;color:#fff;text-shadow:0 0 3px #5d3a12,0 0 3px #5d3a12,0 0 2px #5d3a12;will-change:transform}
.ov.bub{background:#fff;color:#3b2a14;text-shadow:none;border:2px solid #8d6e63;border-radius:12px;padding:3px 9px;font-size:13px;max-width:200px;white-space:normal;text-align:center}
.ov.cnt{background:#e53935;border:2px solid #fff;border-radius:10px;padding:0 6px;font-size:11px;text-shadow:none}
.ov.tag{background:rgba(255,255,255,.92);color:#5d3a12;text-shadow:none;border-radius:10px;padding:1px 7px;font-size:11px}
.ov.buy{background:#43a047;border:2px solid #fff;border-radius:12px;padding:3px 10px;font-size:14px;text-shadow:none}
.fx3{position:absolute;left:0;top:0;font-size:19px;font-weight:900;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 3px #fff;pointer-events:none;will-change:transform,opacity}
#tip{position:absolute;pointer-events:none;background:rgba(40,25,10,.88);color:#fff;font-size:13px;padding:7px 10px;border-radius:10px;line-height:1.5;display:none;z-index:4;white-space:nowrap}
#tip b{color:#ffe082}
#sceneTabs{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2;background:rgba(255,248,230,.92);padding:4px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#sceneTabs button{padding:6px 12px;border-radius:10px;background:transparent;color:#6b3f1d;font-weight:900;font-size:14px}
#sceneTabs button.on{background:#ffb74d;color:#5d3a12}
#hereBox{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,248,230,.92);padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#6b3f1d;box-shadow:0 2px 6px rgba(0,0,0,.15);max-width:45%}
#chatBtn{position:absolute;right:10px;bottom:10px;z-index:2;width:52px;height:52px;border-radius:50%;background:linear-gradient(#ffcc80,#ffa726);font-size:24px;box-shadow:0 4px 0 #e68a00,0 4px 12px rgba(0,0,0,.2)}
#chatBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e68a00}
#hint{position:absolute;left:10px;bottom:12px;z-index:2;font-size:11px;color:#fff;font-weight:700;text-shadow:0 0 3px #3b2a14;pointer-events:none}

#friendStrip{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:rgba(255,248,230,.97);border-top:3px solid #c9a46a;scrollbar-width:thin}
.fr{flex:none;width:68px;background:none;display:flex;flex-direction:column;align-items:center;padding:3px;border-radius:12px;color:#5d3a12}
.fr.on{background:#ffe0a3}
.fr .av{width:42px;height:42px;border-color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.fr.add .av{background:#bdbdbd}
.fn{font-size:12px;font-weight:700;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fl{font-size:11px;color:#8d6e63}
.steal{position:absolute;bottom:-6px;right:-10px;font-style:normal;font-size:11px;background:#43a047;color:#fff;border-radius:8px;padding:0 4px;border:2px solid #fff;animation:pop 1.2s ease-in-out infinite}
.dot{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:#4caf50;border:2px solid #fff}
@keyframes pop{50%{transform:scale(1.15)}}

#tools{display:flex;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#8d5a2b,#6b3f1d);overflow-x:auto}
.tool:first-child{margin-left:auto}.tool:last-child{margin-right:auto}
.tool{flex:none;width:62px;padding:5px 2px;border-radius:14px;background:#fff3d6;color:#6b3f1d;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #c9a46a;position:relative}
.tool .ic{font-size:24px;line-height:1.1}
.tool .tl{font-size:12px;font-weight:700;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}
.tool.on{background:#ffca28;box-shadow:0 3px 0 #e69a2e,0 0 0 3px #fff}
.tool.act{background:#c8e6c9}
.tool em{position:absolute;top:-5px;right:-4px;font-style:normal;font-size:11px;background:#6d4c41;color:#fff;border-radius:8px;padding:0 5px}

#modal{position:fixed;inset:0;background:rgba(30,20,5,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.box{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:#fffaf0;border:4px solid #8d5a2b;border-radius:20px;box-shadow:0 8px 0 #6b3f1d;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#ffcc80,#ffb74d);font-weight:900;font-size:18px;color:#5d3a12}
.mh button{background:#fff3d6;color:#8d5a2b;width:32px;height:32px;border-radius:50%;font-size:16px;font-weight:900}
#mb{overflow-y:auto;padding:12px 14px 16px}
.mtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.mtabs button{flex:1;padding:8px;border-radius:10px;background:#f1e2c4;color:#8d5a2b;font-weight:700;white-space:nowrap}
.mtabs button.on{background:#ffb74d;color:#5d3a12}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#fff;border:2px solid #f1e2c4;margin-bottom:8px}
.item.dim{opacity:.55}
.item.done{border-color:#a5d6a7;background:#f1f8e9}
.item .pic{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(#fffdf5,#f3e6c8);border-radius:12px;font-size:30px;overflow:hidden;position:relative}
.item .pic img{width:56px;height:56px}
.item .info{flex:1;min-width:0}
.item .t{font-weight:900;font-size:15px}
.item .d{font-size:12px;color:#8d6e63;line-height:1.5}
.item .acts{display:flex;flex-direction:column;gap:4px;flex:none}
.need{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.need span{display:flex;align-items:center;gap:2px;background:#f6ecd6;border-radius:10px;padding:1px 6px 1px 2px;font-size:12px;font-weight:700}
.need span img{width:24px;height:24px}
.need span.ok{background:#dcedc8;color:#2e7d32}
.need span.no{background:#ffebee;color:#c62828}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4caf50)}
.b{background:linear-gradient(#7ed957,#4caf50);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:6px 10px;box-shadow:0 2px 0 #2e7d32;white-space:nowrap}
.b.o{background:linear-gradient(#ffcc80,#ffa726);box-shadow:0 2px 0 #e68a00;color:#5d3a12}
.b.r{background:linear-gradient(#ef9a9a,#e57373);box-shadow:0 2px 0 #c62828}
.b.g{background:#e0e0e0;color:#757575;box-shadow:0 2px 0 #bdbdbd}
.b:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;padding:9px 11px;border-radius:12px;border:2px solid #e0c99d;font-size:15px;font-family:inherit;outline:none;min-width:0}
.sec{font-weight:900;color:#8d5a2b;margin:12px 0 6px;font-size:14px}
.empty{text-align:center;color:#a1887f;padding:14px;font-size:14px}
.log{padding:7px 4px;border-bottom:1px dashed #e0c99d;font-size:14px;display:flex;gap:8px;align-items:center}
.log time{color:#a1887f;font-size:12px;flex:none;width:70px}
.log.new{background:#fff3cd}
.help p{font-size:14px;line-height:1.7;margin-bottom:8px}
.help b{color:#e2553f}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.phr button{background:#fff3d6;border:2px solid #e0c99d;border-radius:14px;padding:6px 10px;font-size:14px;color:#5d3a12;font-weight:700}
.cat{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.cat button{padding:4px 10px;border-radius:12px;background:#f6ecd6;color:#8d5a2b;font-weight:700;font-size:13px}
.cat button.on{background:#8d5a2b;color:#fff}
.wheelWrap{position:relative;width:240px;height:240px;margin:6px auto 10px}
.wheelWrap svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.17,.67,.2,1)}
.wheelPin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #e53935;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));z-index:1}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.prof .av{width:64px;height:64px;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stats div{background:#fff;border:2px solid #f1e2c4;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:#8d6e63}
.stats b{display:block;font-size:17px;color:#5d3a12}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid .item{margin:0}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(40,25,10,.9);color:#fff;padding:9px 16px;border-radius:14px;font-size:15px;font-weight:700;animation:tin .25s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

@media (max-width:700px){
  .btns button span{display:none}
  .btns button{padding:5px 6px;font-size:16px}
  .xp{width:56px}
  .xpt{display:none}
  #top{gap:6px;padding:6px}
  .tool{width:49px}
  .tool .ic{font-size:20px}
  .tool .tl{font-size:11px}
  #tools{gap:4px;padding-left:4px;padding-right:4px}
  .fr{width:58px}
  .fr .av{width:36px;height:36px;font-size:15px}
  #sceneTabs button{padding:5px 9px;font-size:13px}
  #chatBtn{width:46px;height:46px;font-size:21px}
  #hint{display:none}
}
</style>
</head>
<body>

<div id="auth">
  <div class="card">
    <div class="logo"><div class="big">🥕🐔🌻🐷🍎</div><h1>歡樂偷菜農場 3D</h1><p>種菜、養動物、養狗貓、煮料理、半夜去好友家偷菜！</p></div>
    <div class="tabs"><button class="on" data-act="authTab" data-t="login">登入</button><button data-act="authTab" data-t="reg">註冊新帳號</button></div>
    <form id="authForm" autocomplete="on">
      <div class="field"><label>帳號（2～10 個字，可用中文）</label><input id="aName" autocomplete="username" maxlength="10" required></div>
      <div class="field"><label>密碼（至少 6 個字）</label><input id="aPass" type="password" autocomplete="current-password" required></div>
      <div class="field" id="aPass2Wrap" hidden><label>再輸入一次密碼</label><input id="aPass2" type="password" autocomplete="new-password"></div>
      <button class="go" id="aGo" type="submit" disabled>載入中…</button>
    </form>
    <div id="authErr"></div>
    <div id="modeNote"></div>
  </div>
</div>

<div id="game" hidden>
  <header id="top">
    <button class="me" data-act="profile"><div class="av" id="myAv"></div><div><div class="nm" id="myName"></div>
      <div class="lvRow"><span class="lv" id="myLv"></span><div class="xp"><i id="myXp"></i></div><span class="xpt" id="myXpT"></span></div></div></button>
    <div class="coins">💰 <b id="myCoins">0</b></div>
    <div class="btns">
      <button data-act="tasks">📋<span>任務</span><em class="badge" id="bdT"></em></button>
      <button data-act="orders">🍳<span>訂單</span><em class="badge" id="bdO"></em></button>
      <button data-act="shop">🏪<span>商店</span></button>
      <button data-act="wh">📦<span>倉庫</span></button>
      <button data-act="friends">👥<span>好友</span><em class="badge" id="bdF"></em></button>
      <button data-act="msgs">📜<span>消息</span><em class="badge" id="bdM"></em></button>
      <button data-act="music" id="musicBtn">🎵<span>音樂</span></button>
      <button data-act="help">❓<span>玩法</span></button>
      <button data-act="logout">🚪<span>登出</span></button>
    </div>
  </header>
  <div id="visitBar" hidden><span>你正在 <b id="visitName"></b> 的家 👀</span><button data-act="home">🏠 回家</button></div>
  <div id="stage">
    <div id="loading">🚜 正在載入 3D 農場…</div>
    <div id="ovl"></div>
    <div id="sceneTabs"><button data-act="scene" data-s="farm" class="on">🌾 農場</button><button data-act="scene" data-s="ranch">🐮 牧場</button></div>
    <div id="hereBox" hidden></div>
    <div id="hint">🖱️ 拖曳旋轉視角、滾輪縮放</div>
    <button id="chatBtn" data-act="chat" title="說話">💬</button>
    <div id="tip"></div>
  </div>
  <div id="friendStrip"></div>
  <nav id="tools"></nav>
</div>

<div id="modal" hidden><div class="box"><div class="mh"><span id="mt"></span><button data-act="close">✕</button></div><div id="mb"></div></div></div>
<div id="toast"></div>

const matureAt = p => p.p + totalMs(p);
const isMature = p => p && p.s === 'grow' && CROPS[p.c] && now() >= matureAt(p);
const probs = p => (p.w || 0) + (p.b || 0) + (p.d ? 1 : 0);
function stageOf(p) { if (p.s !== 'grow' || !CROPS[p.c]) return -1; const pr = (now() - p.p) / totalMs(p); return pr >= 1 ? 3 : pr < 0.15 ? 0 : pr < 0.45 ? 1 : 2; }

  if (end > a.p) { const n = Math.floor((end - a.p) / iv); if (n > 0) { const add = Math.min(n, MAX_STOCK - (a.s || 0)); a.s = (a.s || 0) + add; a.p = add < n ? end : a.p + n * iv; } }

}
const aView = a => settleA(clone(a));

const needFeed = a => a.fu - now() < ivMs(a.k) * 1.5;

function newFarm(username) {
  return {username, nick:'', exp:0, coins:300, plotCount:START_P, plots:Array.from({length:MAXP}, () => ({s:'empty'})),
    seeds:{radish:4, carrot:2, grass:2, daisy:2}, wh:{}, fert:2, feed:5, pets:[], pet:'', ranch:{animals:[], poop:0, pt:0},
    orders:[], ordersDone:0, friends:[], log:[], logSeen:0,

function normalize(f) {

  if (f.dog && !f.pets.includes('dog')) { f.pets.push('dog'); if (!f.pet) f.pet = 'dog'; }
  f.pets = f.pets.filter(k => PETS[k]); if (f.pet && !PETS[f.pet]) f.pet = f.pets[0] || '';

  f.seeds ??= {}; f.wh ??= {}; f.friends ??= []; f.log ??= []; f.orders ??= []; f.ordersDone ??= 0;

const petOf = f => f && f.pet && PETS[f.pet] ? f.pet : '';

function recipeReward(r) { let v = 0; for (const [id, n] of Object.entries(RECIPES[r].need)) v += itemInfo(id).sell * n; return {c:Math.round(v * 1.8 + 20), e:Math.round(5 + v * 0.12)}; }

    const p = f.plots[i]; if (p.s !== 'grow' || !CROPS[p.c]) continue;

      for (let j = done; j < k; j++) if (Math.random() < 0.35 && probs(p) < 3) {
        const o = rnd(p.d ? ['w', 'b'] : ['d', 'w', 'b']);
        if (o === 'b' && Math.random() < bugRate) continue;
        if (o === 'd') p.d = true; else p[o] = (p[o] || 0) + 1;
      }
      p.k = k; ch = true;
    }
  }
  const r = f.ranch;

  if (fillOrders(f)) ch = true;
  return ch;
}

/* ================= 後台：單機測試版 ================= */
function makeLocal() {
  const K = 'hf_local_db', SK = 'hf_local_sess', PK = 'hf_local_pres';
  const load = () => { let d; try { d = JSON.parse(store.getItem(K)) || {}; } catch { d = {}; } d.users ??= {}; d.names ??= {}; d.farms ??= {}; d.req ??= {}; d.gifts ??= {}; return d; };
  const loadP = () => { try { return JSON.parse(store.getItem(PK)) || {}; } catch { return {}; } };
  let db = load(); const watchers = new Set(), pw = new Set(); let authCb = null;
  const save = () => { store.setItem(K, JSON.stringify(db)); notify(); };
  function notify() { for (const w of watchers) { const s = JSON.stringify(db.farms[w.uid] ?? null); if (s !== w.last) { w.last = s; w.cb(JSON.parse(s)); } } }
  function notifyP() { const p = loadP(); for (const w of pw) w.cb(Object.entries(p).filter(([, v]) => v.at === w.at).map(([uid, v]) => ({uid, ...v}))); }
  addEventListener('storage', e => { if (e.key === K) { db = load(); notify(); } if (e.key === PK) notifyP(); });
  return {
    mode:'local',
    onAuth(cb) { authCb = cb; const u = store.getItem(SK); cb(u && db.users[u] ? {uid:u} : null); },
    async register(name, pass) { db = load(); const k = nameKey(name); if (db.names[k]) throw new Error('這個帳號已經有人用了'); const uid = 'u' + Math.random().toString(36).slice(2, 10); db.users[uid] = {pass:await sha(pass)}; db.names[k] = uid; db.farms[uid] = newFarm(name.trim()); save(); store.setItem(SK, uid); authCb({uid}); },
    async login(name, pass) { db = load(); const uid = db.names[nameKey(name)]; if (!uid) throw new Error('帳號不存在'); if (db.users[uid].pass !== await sha(pass)) throw new Error('密碼錯誤'); store.setItem(SK, uid); authCb({uid}); },
    async logout() { store.removeItem(SK); authCb(null); },
    async findUid(name) { db = load(); return db.names[nameKey(name)] || null; },
    async getFarm(uid) { db = load(); return db.farms[uid] ? clone(db.farms[uid]) : null; },
    async rebuildFarm(uid) { db = load(); const name = Object.keys(db.names).find(k => db.names[k] === uid); if (!name || db.farms[uid]) return false; db.farms[uid] = newFarm(name); save(); return true; },
    watch(uid, cb) { const w = {uid, cb, last:undefined}; watchers.add(w); setTimeout(notify, 0); return () => watchers.delete(w); },
    async tx(uid, fn) { db = load(); const f = db.farms[uid]; if (!f) throw new Error('找不到農場'); const c = normalize(clone(f)); const r = fn(c) || {}; if (r.abort) return r; db.farms[uid] = c; save(); return r; },
    async sendReq(from, fromName, to) { db = load(); db.req[to + '_' + from] = {from, fromName, to, t:now()}; save(); },
    async listReq(uid) { db = load(); return Object.entries(db.req).filter(([, r]) => r.to === uid).map(([id, r]) => ({id, ...r})); },
    async delReq(id) { db = load(); delete db.req[id]; save(); },
    async setPresence(uid, d) { const p = loadP(); p[uid] = {...(p[uid] || {}), ...d}; store.setItem(PK, JSON.stringify(p)); notifyP(); },
    watchHere(at, cb) { const w = {at, cb}; pw.add(w); setTimeout(notifyP, 0); return () => pw.delete(w); },
    async listRecent() { return Object.entries(loadP()).map(([uid, v]) => ({uid, ...v})).sort((a, b) => b.t - a.t).slice(0, 40); },
    async getPresence(uid) { return loadP()[uid] || null; },
    async sendGift(g) { db = load(); db.gifts['g' + Math.random().toString(36).slice(2, 10)] = g; save(); },
    async listGifts(uid) { db = load(); return Object.entries(db.gifts).filter(([, g]) => g.to === uid).map(([id, g]) => ({id, ...g})); },
    async takeGift(id) { db = load(); const g = db.gifts[id]; if (!g) return null; delete db.gifts[id]; save(); return g; },
  };
}

/* ================= 後台：Firebase 連線版 ================= */
async function makeFirebase(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg); const auth = A.getAuth(app);
  const db = F.initializeFirestore(app, {ignoreUndefinedProperties:true, ...(QS.has('lp') ? {experimentalForceLongPolling:true} : {})});
  const email = name => 'u' + hex(nameKey(name)) + '@hfarm.game';
  const fref = uid => F.doc(db, 'farms', uid);
  const MSG = {'auth/invalid-credential':'帳號或密碼錯誤', 'auth/wrong-password':'帳號或密碼錯誤', 'auth/user-not-found':'帳號不存在',
    'auth/invalid-login-credentials':'帳號或密碼錯誤', 'auth/email-already-in-use':'這個帳號已經有人用了', 'auth/weak-password':'密碼至少要 6 個字',
    'auth/too-many-requests':'嘗試太多次，請稍後再試', 'auth/network-request-failed':'網路連線失敗',
    'auth/operation-not-allowed':'Firebase 還沒開啟「電子郵件/密碼」登入', 'permission-denied':'資料庫拒絕存取（請檢查 Firestore 規則）'};
  const wrap = e => new Error(MSG[e.code] || e.message);
  let regP = null;
  return {
    mode:'firebase',
    onAuth(cb) { A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid} : null)); },
    async settle() { if (regP) await regP.catch(() => {}); },
    async register(name, pass) { regP = this._register(name, pass); try { await regP; } finally { regP = null; } },
    async _register(name, pass) {
      try {
        const k = nameKey(name);
        if ((await F.getDoc(F.doc(db, 'usernames', k))).exists()) throw new Error('這個帳號已經有人用了');
        const cred = await A.createUserWithEmailAndPassword(auth, email(name), pass);
        try { await F.setDoc(F.doc(db, 'usernames', k), {uid:cred.user.uid}); } catch (e) { await cred.user.delete().catch(() => {}); throw new Error('這個帳號已經有人用了'); }
        await F.setDoc(fref(cred.user.uid), newFarm(name.trim()));
      } catch (e) { throw e.code ? wrap(e) : e; }
    },
    async login(name, pass) { try { await A.signInWithEmailAndPassword(auth, email(name), pass); } catch (e) { throw wrap(e); } },
    async logout() { await A.signOut(auth); },
    async findUid(name) { const s = await F.getDoc(F.doc(db, 'usernames', nameKey(name))); return s.exists() ? s.data().uid : null; },
    async getFarm(uid) { const s = await F.getDoc(fref(uid)); return s.exists() ? s.data() : null; },
    async rebuildFarm(uid) {
      const u = auth.currentUser; if (!u || u.uid !== uid || !/^u[0-9a-f]+@hfarm\.game$/.test(u.email || '')) return false;
      const h = u.email.slice(1, u.email.indexOf('@')); const name = new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x => parseInt(x, 16))));
      if ((await F.getDoc(fref(uid))).exists()) return false;
      const un = await F.getDoc(F.doc(db, 'usernames', nameKey(name)));
      if (!un.exists()) await F.setDoc(F.doc(db, 'usernames', nameKey(name)), {uid}).catch(() => {});
      await F.setDoc(fref(uid), newFarm(name)); return true;
    },
    watch(uid, cb) { return F.onSnapshot(fref(uid), s => cb(s.exists() ? s.data() : null), e => console.warn(e)); },
    async tx(uid, fn) {
      try {
        return await F.runTransaction(db, async t => {
          const s = await t.get(fref(uid)); if (!s.exists()) throw new Error('找不到農場');
          const base = normalize(clone(s.data())), c = clone(base); const r = fn(c) || {}; if (r.abort) return r;
          const ch = {}; for (const k of Object.keys(c)) if (JSON.stringify(c[k]) !== JSON.stringify(base[k])) ch[k] = c[k];
          if (Object.keys(ch).length) t.update(fref(uid), ch); return r;
        });
      } catch (e) { throw e.code ? wrap(e) : e; }
    },
    async sendReq(from, fromName, to) { await F.setDoc(F.doc(db, 'requests', to + '_' + from), {from, fromName, to, t:now()}); },
    async listReq(uid) { const q = await F.getDocs(F.query(F.collection(db, 'requests'), F.where('to', '==', uid))); return q.docs.map(d => ({id:d.id, ...d.data()})); },
    async delReq(id) { await F.deleteDoc(F.doc(db, 'requests', id)); },
    async setPresence(uid, d) { await F.setDoc(F.doc(db, 'presence', uid), d, {merge:true}).catch(e => console.warn(e)); },
    watchHere(at, cb) { return F.onSnapshot(F.query(F.collection(db, 'presence'), F.where('at', '==', at)), s => cb(s.docs.map(d => ({uid:d.id, ...d.data()}))), e => console.warn(e)); },
    async listRecent() { const q = await F.getDocs(F.query(F.collection(db, 'presence'), F.orderBy('t', 'desc'), F.limit(40))); return q.docs.map(d => ({uid:d.id, ...d.data()})); },
    async getPresence(uid) { const s = await F.getDoc(F.doc(db, 'presence', uid)); return s.exists() ? s.data() : null; },
    async sendGift(g) { try { await F.addDoc(F.collection(db, 'gifts'), g); } catch (e) { throw wrap(e); } },
    async listGifts(uid) { const q = await F.getDocs(F.query(F.collection(db, 'gifts'), F.where('to', '==', uid))); return q.docs.map(d => ({id:d.id, ...d.data()})); },
    async takeGift(id) { return F.runTransaction(db, async t => { const r = F.doc(db, 'gifts', id); const s = await t.get(r); if (!s.exists()) return null; t.delete(r); return s.data(); }); },
  };
}

/* ================= 3D：基礎工具 ================= */
const MATS = new Map();
function mat(c) { let m = MATS.get(c); if (!m) { m = new THREE.MeshLambertMaterial({color:c, flatShading:true}); MATS.set(c, m); } return m; }
const GEO = {};
const geoOf = (k, f) => GEO[k] || (GEO[k] = f());
const gS = () => geoOf('s', () => new THREE.SphereGeometry(1, 10, 8));
const gB = () => geoOf('b', () => new THREE.BoxGeometry(1, 1, 1));
const gC = () => geoOf('c', () => new THREE.CylinderGeometry(1, 1, 1, 10));
const gN = () => geoOf('n', () => new THREE.ConeGeometry(1, 1, 8));
const gT = () => geoOf('t', () => new THREE.TorusGeometry(1, 0.22, 6, 16));
const gO = () => geoOf('o', () => new THREE.OctahedronGeometry(1));
function M(geom, c, s, p, r) { const m = new THREE.Mesh(geom, typeof c === 'string' ? mat(c) : c); if (s) m.scale.set(s[0], s[1], s[2]); if (p) m.position.set(p[0], p[1], p[2]); if (r) m.rotation.set(r[0], r[1], r[2]); m.castShadow = true; m.receiveShadow = true; return m; }
const ball = (c, s, p, r) => M(gS(), c, s, p, r);
const blk = (c, s, p, r) => M(gB(), c, s, p, r);
const rod = (c, s, p, r) => M(gC(), c, s, p, r);
const cone = (c, s, p, r) => M(gN(), c, s, p, r);
const ring = (c, s, p, r) => M(gT(), c, s, p, r);
const U = r => [r, r, r];
function grp(...a) { const G = new THREE.Group(); for (const o of a.flat()) if (o) G.add(o); return G; }
function leaf(c, len, w, ang, tilt, y = 0.02) {
  const piv = new THREE.Group(); piv.position.y = y; piv.rotation.order = 'YXZ'; piv.rotation.y = ang; piv.rotation.x = -tilt;
  piv.add(ball(c, [w, Math.max(0.02, w * 0.16), len / 2], [0, 0, len / 2])); return piv;
}
function rosette(c, n, len, w, tilt, y = 0.02, ph = 0) { const G = new THREE.Group(); for (let k = 0; k < n; k++) G.add(leaf(c, len, w, ph + k / n * Math.PI * 2, tilt, y)); return G; }
function pivot(x, y, z, ...ch) { const p = new THREE.Group(); p.position.set(x, y, z); ch.forEach(c => p.add(c)); return p; }

const LEAF = '#5aa832', LEAF2 = '#3d8b28', STEM = '#4f8f2a';

    case 'grain': { for (let i = 0; i < 7; i++) { const a = i / 7 * 6.28, r = .05 + (i % 2) * .08, h = .75; const col = ripe ? '#cfae4a' : '#7cb342'; g.add(blk(col, [.025, h, .025], [Math.cos(a) * r, h / 2, Math.sin(a) * r], [Math.sin(a) * .12, 0, Math.cos(a) * .12])); g.add(ball(ripe ? c2 : '#9ccc65', [.035, .11, .035], [Math.cos(a) * r * 1.4, h + .06, Math.sin(a) * r * 1.4], [Math.sin(a) * .3, 0, Math.cos(a) * .3])); } g.add(rosette('#7cb342', 5, .35, .05, 1.1)); break; }
    case 'bamboo': { for (let i = 0; i < 3; i++) { const x = (i - 1) * .22, z = (i % 2) * .15, h = 1.6 + i * .3; for (let s = 0; s < 5; s++) { g.add(rod('#6fa83a', [.07, h / 5 - .02, .07], [x, s * h / 5 + h / 10, z])); g.add(rod('#558b2f', [.08, .025, .08], [x, (s + 1) * h / 5, z])); } g.add(leaf('#7cb342', .4, .07, i * 2, .3, h * .8).translateX(x)); g.add(leaf('#8bc34a', .35, .06, i * 2 + 2.5, .2, h * .95).translateX(x)); } break; }

    case 'tuber': { g.add(ball('#5b9e34', [.3, .2, .3], [0, .22, 0]), rosette(LEAF, 6, .35, .12, .6, .25)); if (ripe) for (let i = 0; i < 3; i++) g.add(ball(c2, [.1, .08, .12], [Math.cos(i * 2.1) * .3, .05, Math.sin(i * 2.1) * .3])); break; }
    case 'bulb': { g.add(rosette('#66bb6a', 5, .5, .035, 1.35, .15)); g.add(ball(ripe ? c2 : '#cfd8a8', ripe ? [.15, .13, .15] : [.08, .08, .08], [0, .1, 0])); break; }
    case 'leafy': {

      else { g.add(rosette(LEAF2, 6, .42, .16, .35, .03)); g.add(rosette(sp.c, 6, .34, .15, .75, .06, .5)); }
      if (sp.head && ripe) g.add(ball('#d4ea9c', [.22, .2, .22], [0, .22, 0]), rosette('#b5d97a', 5, .22, .14, 1.2, .14, .3));

/* ----- 每一幀 ----- */
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now() / 1000, w = W.renderer.domElement.clientWidth, h = W.renderer.domElement.clientHeight;
  if (W.camAnim) { const a = W.camAnim, k = a.dur ? Math.min(1, (performance.now() - a.t0) / a.dur) : 1, e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; const off = W.camera.position.clone().sub(W.controls.target); W.controls.target.lerpVectors(a.from, a.to, e); W.camera.position.copy(W.controls.target).add(off); if (k >= 1) W.camAnim = null; }
  W.controls.update();
  W.blades.rotation.z = -t * .9;
  for (const c of W.clouds) { c.position.x += .012; if (c.position.x > 90) c.position.x = -70; }
  W.ripples.forEach((r, i) => { const k = (t * .35 + i / 3) % 1; r.scale.setScalar(.4 + k * 2.6); r.material.opacity = .55 * (1 - k); });
  for (const f of W.flies) { const a = t * .5 + f.ph; f.b.position.set(f.cx + Math.cos(a) * f.r, 1.2 + Math.sin(t * 2 + f.ph) * .4, Math.sin(a * 1.3) * f.r * .55); f.b.rotation.y = -a; const fl = Math.sin(t * 22 + f.ph) * .9; f.w1.rotation.x = fl; f.w2.rotation.x = -fl; }
  // 作物搖擺、蟲、水滴、閃光
  W.plots.forEach((P, i) => {
    if (P.plant) P.plant.rotation.z = Math.sin(t * 1.6 + i) * .025;
    for (const b of P.bugs) { const a = t * 1.2 + b.ph; b.g.position.set(Math.cos(a) * .45, .35 + Math.sin(a * 2) * .05, Math.sin(a) * .45); b.g.rotation.y = -a - Math.PI / 2; }
    if (P.drop) P.drop.position.y = 1.6 + Math.sin(t * 3 + i) * .12;
    if (P.spark.visible) { P.spark.rotation.y = t * 2; P.spark.position.y = 1.9 + Math.sin(t * 2.5 + i) * .15; }
  });
  // 動物走動
  for (const A of W.animals) {
    if (A.still) { (A.m.userData.bees || []).forEach((b, k) => { const a = t * 2.5 + k * 2.1; b.position.set(Math.cos(a) * .55, .8 + Math.sin(a * 2) * .2, Math.sin(a) * .55); b.rotation.y = -a; }); continue; }
    const wx = .25 * Math.cos(t * .23 + A.ph), wz = .22 * Math.sin(t * .29 + A.ph * 1.3), pause = Math.sin(t * .4 + A.ph) > .3;
    const x = A.home[0] + Math.sin(t * .23 + A.ph) * 1.0, z = A.home[1] + Math.sin(t * .29 + A.ph * 1.3) * .75;
    if (!pause) { A.g.position.x = x; A.g.position.z = z; A.g.rotation.y = Math.atan2(-wz, wx); }
    const sw = pause ? 0 : Math.sin(t * 9 + A.ph) * .45;
    (A.m.userData.legs || []).forEach((l, k) => l.rotation.z = (k === 0 || k === 3 ? sw : -sw));
    if (A.m.userData.head) A.m.userData.head.rotation.z = pause ? -.35 + Math.sin(t * 3 + A.ph) * .15 : Math.sin(t * 4 + A.ph) * .06;
    if (A.m.userData.tail) A.m.userData.tail.rotation.x = Math.sin(t * 5 + A.ph) * .4;
    A.ind.position.y += 0; A.ind.rotation.y = t * 1.5;
  }
  // 寵物巡邏
  for (const P of W.pets) {
    const d = t * P.sp + P.ph, a = pathAt(d); P.m.position.set(a.x, 0, a.z); P.m.rotation.y = Math.atan2(-a.dz, a.dx);
    const sw = Math.sin(t * P.sp * 7 + P.ph) * .42; (P.m.userData.legs || []).forEach((l, k) => l.rotation.z = (k === 0 || k === 3 ? sw : -sw));
    if (P.m.userData.tail) P.m.userData.tail.rotation.x = Math.sin(t * 12 + P.ph) * .5;
    if (P.m.userData.head) P.m.userData.head.rotation.y = Math.sin(t * 1.3 + P.ph) * .3;
    P.m.userData.top = PETS[P.k].kind === 'dog' ? 1.15 * (PETS[P.k].sp.size || 1) : 1.0 * (PETS[P.k].sp.size || 1);
  }
  // 人物
  for (const P of W.people) { if (P.tx === undefined) continue; P.m.position.x += (P.tx - P.m.position.x) * .08; P.m.position.z += (P.tz - P.m.position.z) * .08; P.m.position.y = Math.abs(Math.sin(t * 2 + P.k)) * .05; P.m.rotation.y = -Math.PI / 2 + Math.sin(t * .7 + P.k) * .3; if (P.m.userData.head) P.m.userData.head.rotation.x = Math.sin(t * 1.1 + P.k) * .1; }
  if (W.hoverRing.visible) W.hoverRing.material.opacity = .55 + Math.sin(t * 6) * .3;
  W.renderer.render(W.scene, W.camera);
  for (const o of OV.values()) projectTo(o.el, o.pos(_v.set(0, 0, 0)), w, h);
  for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i], age = (performance.now() - f.t0) / 1500; if (age >= 1) { f.el.remove(); FX.splice(i, 1); continue; } projectTo(f.el, f.p, w, h, age * 60); f.el.style.opacity = age < .15 ? age / .15 : 1 - (age - .15) / .85; }
}

/* ================= 背景音樂（原創，WebAudio 合成） ================= */
const Music = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextT = 0, on = false, wanted = store.getItem('hf_music') !== 'off';
  const E = 60 / 112 / 2;
  const MEL = [67,72,76,72,67,72,76,79, 77,76,74,72,69,72,74,-1, 74,71,67,71,74,79,77,74, 76,72,67,72,76,-1,-1,-1,
               69,72,76,72,69,72,76,81, 81,79,77,76,74,72,74,77, 79,77,76,74,72,71,74,71, 72,-1,67,-1,72,-1,-1,-1,
               64,67,72,67,64,67,72,74, 77,74,72,69,72,74,77,81, 79,76,74,71,74,76,79,83, 84,-1,79,-1,76,-1,72,-1];

  const CH = {48:[60,64,67], 41:[57,60,65], 43:[55,59,62], 45:[57,60,64]};

    o.type = type; o.frequency.value = hz(m); lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut, t); lp.frequency.exponentialRampToValueAtTime(500, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + d + .05);
  }
  let nb = null;
  function shaker(t, v) { if (!nb) { nb = ctx.createBuffer(1, ctx.sampleRate * .1, ctx.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = nb; hp.type = 'highpass'; hp.frequency.value = 7000; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05); s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t + .06); }
  function drum(t) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(45, t + .12); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g).connect(master); o.start(t); o.stop(t + .2); }
  function sched() {
    while (nextT < ctx.currentTime + .3) {
      const e = step % 8, bar = Math.floor(step / 8) % 12, n = MEL[step % 96], root = ROOTS[bar];
      if (n > 0) { tone(nextT, n, .13, .34, 'triangle'); tone(nextT, n + 12, .025, .16, 'square', 2500); }
      if (e === 0) { tone(nextT, root - 12, .2, .42); drum(nextT); }
      if (e === 4) { tone(nextT, root - 5, .16, .38); drum(nextT); }

    sfx(kind) { if (!wanted || !ensure()) return; const t = ctx.currentTime; if (kind === 'coin') { tone(t, 88, .12, .12, 'square', 5000); tone(t + .07, 93, .12, .2, 'square', 5000); } else if (kind === 'pop') { tone(t, 79, .15, .15); tone(t + .06, 84, .15, .2); } else if (kind === 'bad') { tone(t, 55, .2, .3, 'sawtooth', 900); tone(t + .12, 50, .2, .35, 'sawtooth', 900); } },

})();

function hereList() { return S.here.filter(p => !p.off && p.t && now() - p.t < 75000).sort((a, b) => a.uid < b.uid ? -1 : 1); }
function stealCount(farm) { return farm.plots.slice(0, farm.plotCount).filter(p => { const s = stealInfo(p, S.uid); return s && s.can; }).length + (farm.ranch?.animals || []).filter(a => ANIMALS[a.k] && aStealable(a, S.uid)).length; }
function renderStrip() {

/* ----- 提示文字 ----- */
function plotText(i) {
  const f = S.view; if (!f) return '';
  if (i >= f.plotCount) return isOwn() && i === f.plotCount ? `<b>擴建土地</b><br>需要 Lv.${plotLv(i + 1)}、💰${plotPrice(i + 1)}` : '尚未開墾';
  const p = f.plots[i];
  if (p.s === 'empty' || !CROPS[p.c]) return isOwn() ? '空地 · 點一下播種' : '空地';
  if (p.s === 'dead') return `<b>${CROPS[p.c].n}</b>（已收成）<br>${isOwn() ? '用 ⛏️ 翻地後就能再種' : '枯萎了'}`;
  const c = CROPS[p.c]; let t = `<b>${c.n}</b> `;
  if (isMature(p)) { t += '已成熟！'; if (isOwn()) t += `<br>可收成 ${harvestAmt(p)} 個${p.st ? `（被偷了 ${p.st} 個）` : ''}`; else { const si = stealInfo(p, S.uid); t += si.can ? `<br>還能偷 ${si.avail} 個 🥷` : si.mine ? '<br>你已經偷過這塊了' : '<br>剩下的不能再偷了'; } }
  else t += `<br>還要 ${fmtDur(matureAt(p) - now())} 成熟`;
  const pr = []; if (p.d) pr.push('💧缺水'); if (p.w) pr.push(`🌿雜草×${p.w}`); if (p.b) pr.push(`🐞蟲×${p.b}`);
  if (pr.length) t += `<br>${pr.join(' ')}（每個問題減產 10%）`;
  return t;
}
function aniText(i) {
  const a = S.view?.ranch?.animals[i]; if (!a) return '';
  const A = ANIMALS[a.k], v = aView(a); let t = `<b>${A.n}</b>${isBaby(a) ? '（寶寶）' : ''}<br>`;
  if (v.s) t += `有 ${v.s} 個${PROD[A.prod].n}可以${isOwn() ? '收' : aStealable(a, S.uid) ? '偷 🥷' : '看（偷過了或剩太少）'}<br>`;
  if (isHungry(a)) t += `🍽️ 肚子餓了，不會生產${isOwn() ? '' : '（可以幫忙餵）'}`;
  else if (v.s >= MAX_STOCK) t += '產品滿了，快收走';
  else t += `下一個${PROD[A.prod].n}：${fmtDur(v.p + ivMs(a.k) - now())}<br>飽足還有 ${fmtDur(a.fu - now())}`;
  return t;
}
function tipFor(h) {
  if (h.type === 'tile') return plotText(h.i);
  if (h.type === 'ani') return aniText(h.i);
  if (h.type === 'poop') return '💩 便便！點一下清掉' + (isOwn() ? '（+1 經驗）' : '（幫忙 +2 經驗）');
  if (h.type === 'trough') return isOwn() ? `<b>飼料槽</b><br>牧草 ${S.my.wh.grass || 0}、飼料 ${S.my.feed || 0}<br>點一下幫肚子快餓的動物餵食` : '飼料槽 · 點一下用你的飼料幫好友餵動物';
  return '';
}
function showTip(h) { const tip = $('#tip'); tip.innerHTML = tipFor(h); tip.style.display = tip.innerHTML ? 'block' : 'none'; }
const plain = h => tipFor(h).replace(/<br>/g, '，').replace(/<[^>]+>/g, '');

/* ================= 點擊動作 ================= */
async function run(fn) { if (S.busy) return; S.busy = true; try { await fn(); } catch (e) { console.error(e); toast('出錯了：' + e.message); } finally { S.busy = false; } }
function clickHit(h) {
  if (!S.view) return;
  if (h.type === 'tile') { if (S.scene !== 'farm') { S.scene = 'farm'; setCam('farm'); renderTools(); } return clickPlot(h.i); }
  if (h.type === 'ani') { if (S.scene !== 'ranch') { S.scene = 'ranch'; setCam('ranch'); renderTools(); } return run(() => clickAnimal(h.i)); }
  if (h.type === 'poop') return run(() => cleanPoop(h.i));
  if (h.type === 'trough') return run(isOwn() ? feedAll : feedFriend);
}
function smartTool(p, own) {
  if (own) { if (p.s === 'dead') return 'plow'; if (p.s === 'empty' || !CROPS[p.c]) return 'plant'; if (isMature(p)) return 'harvest'; }
  else if (isMature(p)) { const si = stealInfo(p, S.uid); if (si.can) return 'steal'; }
  if (p.s === 'grow') { if (p.d) return 'water'; if (p.w) return 'weed'; if (p.b) return 'bug'; }
  return null;
}
function clickPlot(i) {
  const f = S.view, own = isOwn();
  if (i >= f.plotCount) { if (own && i === f.plotCount) run(buyPlot); return; }
  const p0 = f.plots[i]; let tool = S.tool;
  if (tool === 'plant' && own && p0.s !== 'empty' && CROPS[p0.c]) tool = 'hand';
  if (tool === 'hand') tool = smartTool(p0, own);
  if (!tool) return toast(plain({type:'tile', i}));
  run(() => ACT_PLOT[tool](i));
}
const txMe = fn => B.tx(S.uid, fn);
const txView = fn => B.tx(S.viewUid, fn);
const ab = msg => ({abort:1, msg});
function guardCheck(f, nm) { const pk = petOf(f); if (pk && PETS[pk].bite && Math.random() < PETS[pk].bite) { addLog(f, `🐾 你的${PETS[pk].n}抓到來偷東西的 ${nm}，罰他 ${CAUGHT_COINS} 金幣和倉庫物品！`); return PETS[pk].n; } return ''; }
async function caught(x, y, z, petName) {
  const g = await txMe(f => {
    const lost = Math.min(f.coins, CAUGHT_COINS); f.coins -= lost;
    const items = Object.entries(f.wh).filter(([, n]) => n > 0); let it = '', n = 0;
    if (items.length) { const [k, have] = rnd(items); n = Math.min(have, CAUGHT_ITEMS); f.wh[k] -= n; it = k; }
    return {lost, it, n};
  });
  fx3(x, y, z, `🚨 被${petName}抓到了！`, '#d32f2f'); Music.sfx('bad');
  toast(`🚨 被${petName}抓到！罰 ${g.lost} 金幣${g.n ? `，倉庫的${itemInfo(g.it).n}被沒收 ${g.n} 個` : ''} 😭`);
}

const ACT_PLOT = {
  async harvest(i) {
    const r = await txMe(f => { const p = f.plots[i]; if (!isMature(p)) return ab('還沒成熟'); const c = CROPS[p.c], amt = harvestAmt(p); f.wh[p.c] = (f.wh[p.c] || 0) + amt; const up = gainExp(f, c.exp); f.plots[i] = {s:'dead', c:p.c}; bump(f, 'harvest'); return {amt, c:p.c, exp:c.exp, up}; });
    if (r.abort) return toast(r.msg);
    fxPlot(i, `+${r.amt} ${CROPS[r.c].n}`); fxPlot(i, `+${r.exp} 經驗`, '#f57c00', -.5); Music.sfx('pop'); lvToast(r.up);
  },
  async plow(i) {
    const p = S.view.plots[i];
    if (p.s === 'empty') return toast('這塊地是空的，可以直接播種');
    if (p.s === 'grow' && CROPS[p.c] && !confirm(`確定要把還在長的${CROPS[p.c].n}剷掉嗎？`)) return;
    const r = await txMe(f => { if (f.plots[i].s === 'empty') return ab('已經是空地了'); const wasDead = f.plots[i].s === 'dead'; f.plots[i] = {s:'empty'}; return {up:wasDead ? gainExp(f, 1) : 0, wasDead}; });
    if (r.abort) return toast(r.msg); fxPlot(i, r.wasDead ? '+1 經驗' : '剷掉了', '#f57c00'); lvToast(r.up);
  },
  async plant(i) {
    const id = S.seed; if (!id) return openSeedPicker(i);
    const c = CROPS[id];
    const r = await txMe(f => {
      const p = f.plots[i];
      if (p.s === 'dead') return ab('先用 ⛏️ 翻地才能播種'); if (p.s !== 'empty' && CROPS[p.c]) return ab('這塊地已經種東西了');
      if (levelOf(f.exp).L < c.lv) return ab(`Lv.${c.lv} 才能種${c.n}`);
      let bought = false; if ((f.seeds[id] || 0) > 0) f.seeds[id]--; else if (f.coins >= c.cost) { f.coins -= c.cost; bought = true; } else return ab(`金幣不夠買${c.n}種子`);
      f.plots[i] = {s:'grow', c:id, p:now(), w:0, b:0, d:false, st:0, th:[], k:0, f:0}; bump(f, 'plant'); return {bought};
    });
    if (r.abort) return toast(r.msg); fxPlot(i, r.bought ? `🌱 -${c.cost}💰` : '🌱 播種', '#558b2f');
  },
  async fert(i) {
    const r = await txMe(f => {
      const p = f.plots[i]; if (p.s !== 'grow' || !CROPS[p.c]) return ab('這塊地沒有作物'); if (isMature(p)) return ab('已經成熟了，直接收成吧'); if (p.f) return ab('這一季已經施過肥了');
      if (f.fert > 0) f.fert--; else if (f.wh.manure > 0) f.wh.manure--; else return ab('沒有化肥了，去商店買或養馬產有機肥');
      p.f = Math.round(Math.min(matureAt(p) - now(), growMs(p.c) * 0.3)); return {saved:p.f};
    });
    if (r.abort) return toast(r.msg); fxPlot(i, `🧪 快了 ${fmtDur(r.saved)}`, '#7b1fa2');
  },
  water(i) { return fix(i, 'd'); }, weed(i) { return fix(i, 'w'); }, bug(i) { return fix(i, 'b'); },
  pbug(i) { return prank(i, 'b'); }, pweed(i) { return prank(i, 'w'); },
  async steal(i) {
    const me = S.uid, nm = myName();
    const r = await txView(f => {
      const p = f.plots[i], si = stealInfo(p, me);
      if (!si) return ab('還沒成熟，不能偷'); if (!si.can) return ab(si.mine ? '這塊你已經偷過了' : '剩下的不能再偷了，留一點給人家吧');
      p.th = [...(p.th || []), me];
      const pet = guardCheck(f, nm); if (pet) return {caught:pet};
      const n = Math.min(si.avail, 1 + Math.floor(Math.random() * 3)); p.st = (p.st || 0) + n;
      addLog(f, `🥷 ${nm} 偷走了你 ${n} 個${CROPS[p.c].n}`); return {n, c:p.c};
    });
    if (r.abort) return toast(r.msg);
    const [x, z] = plotXZ(i);
    if (r.caught) return caught(x, 1.5, z, r.caught);
    await txMe(f => { f.wh[r.c] = (f.wh[r.c] || 0) + r.n; bump(f, 'steal'); return {}; });
    fxPlot(i, `🥷 +${r.n} ${CROPS[r.c].n}`); Music.sfx('pop');
  },
};
const FIX = {d:['澆水', '不用澆水'], w:['拔草', '沒有雜草'], b:['除蟲', '沒有蟲']};
async function helpReward(task = 'help') { return txMe(f => { const d = daily(f); const e = d.help < DAILY_HELP_EXP ? 2 : 0; d.help += e; f.coins += 1; bump(f, task); return {e, up:e ? gainExp(f, e) : 0}; }); }
async function fix(i, key) {
  const [label, none] = FIX[key], nm = myName();
  const doFix = p => { if (!p || p.s !== 'grow' || !p[key]) return false; if (key === 'd') p.d = false; else p[key]--; return true; };
  if (isOwn()) { const r = await txMe(f => doFix(f.plots[i]) ? {up:gainExp(f, 1)} : ab(none)); if (r.abort) return toast(r.msg); fxPlot(i, `${label} +1 經驗`, '#0277bd'); lvToast(r.up); return; }
  const r = await txView(f => { if (!doFix(f.plots[i])) return ab(none); addLog(f, `🤝 ${nm} 幫你${label}`); return {}; });
  if (r.abort) return toast(r.msg);
  const g = await helpReward(); fxPlot(i, g.e ? `幫忙${label} +2 經驗` : `幫忙${label} +1💰`, '#0277bd'); lvToast(g.up);
}
async function prank(i, key) {
  if (dailyView(S.my).prank >= DAILY_PRANK) return toast('今天的惡作劇次數用完了，明天再來 😈');
  const nm = myName();
  const r = await txView(f => { const p = f.plots[i]; if (!p || p.s !== 'grow') return ab('這塊地沒有作物'); if (isMature(p)) return ab('已經成熟了，放了也沒用'); if (probs(p) >= 3) return ab('這塊地已經夠慘了，放過它吧'); p[key] = (p[key] || 0) + 1; addLog(f, key === 'b' ? `🐛 ${nm} 在你的田裡放了蟲` : `🌾 ${nm} 在你的田裡種了雜草`); return {}; });
  if (r.abort) return toast(r.msg);
  await txMe(f => { daily(f).prank++; return {}; }); fxPlot(i, key === 'b' ? '🐛 嘿嘿' : '🌾 嘿嘿', '#6a1b9a');
}
async function clickAnimal(i) {
  const a = S.view.ranch.animals[i]; if (!a) return;
  if (isOwn()) {
    const v = aView(a);
    if (!v.s) { if (isHungry(a) || needFeed(a)) return feedAll(); return toast(plain({type:'ani', i})); }
    const r = await txMe(f => { const x = f.ranch.animals[i]; if (!x) return ab('找不到這隻動物'); settleA(x); if (!x.s) return ab('還沒有產品'); const A = ANIMALS[x.k], n = x.s; f.wh[A.prod] = (f.wh[A.prod] || 0) + n; x.s = 0; x.th = []; const up = gainExp(f, A.exp * n); bump(f, 'collect', n); return {n, prod:A.prod, e:A.exp * n, up}; });
    if (r.abort) return toast(r.msg); fxAni(i, `+${r.n} ${PROD[r.prod].n}`); fxAni(i, `+${r.e} 經驗`, '#f57c00', -.5); Music.sfx('pop'); lvToast(r.up); return;
  }
  if (!aStealable(a, S.uid)) { if (isHungry(a)) return feedFriend(); return toast(plain({type:'ani', i})); }
  const me = S.uid, nm = myName();
  const r = await txView(f => {
    const x = f.ranch.animals[i]; if (!x) return ab('找不到這隻動物'); settleA(x);
    if ((x.th || []).includes(me)) return ab('這隻你已經偷過了'); if (x.s < 2) return ab('剩太少了，留一點給人家吧');
    x.th = [...(x.th || []), me]; const pet = guardCheck(f, nm); if (pet) return {caught:pet};
    x.s--; const A = ANIMALS[x.k]; addLog(f, `🥷 ${nm} 偷走了你的${A.n}生的 1 個${PROD[A.prod].n}`); return {prod:A.prod};
  });
  if (r.abort) return toast(r.msg);
  const p = W.animals[i]?.g.position || {x:24, z:0};
  if (r.caught) return caught(p.x, 1.6, p.z, r.caught);
  await txMe(f => { f.wh[r.prod] = (f.wh[r.prod] || 0) + 1; bump(f, 'steal'); return {}; });
  fxAni(i, `🥷 +1 ${PROD[r.prod].n}`); Music.sfx('pop');
}
async function feedAll() {
  if (!isOwn()) return feedFriend();
  const r = await txMe(f => {
    const list = f.ranch.animals; if (!list.length) return ab('還沒有動物，去商店買吧');
    let fed = 0, used = 0; const t = now();
    for (const a of list) { if (!needFeed(a)) continue; const eat = ANIMALS[a.k].eat; if ((f.wh.grass || 0) + (f.feed || 0) < eat) { if (!fed) return ab(`飼料不夠了（${ANIMALS[a.k].n}要吃 ${eat} 份）。種牧草或去商店買飼料吧`); break; } useFeed(f, eat); feedOne(a, t); fed++; used += eat; }
    if (!fed) return ab('大家都吃很飽，晚點再餵 😋'); bump(f, 'feed'); return {fed, used, up:gainExp(f, fed)};
  });
  if (r.abort) return toast(r.msg); fx3(TROUGH_XZ[0], 1.6, TROUGH_XZ[1], `🌾 餵了 ${r.fed} 隻（用掉 ${r.used} 份）`, '#8d6e63'); lvToast(r.up);
}
async function feedFriend() {
  if (isOwn()) return feedAll();
  const avail = (S.my.wh.grass || 0) + (S.my.feed || 0); if (!avail) return toast('你沒有牧草或飼料可以餵，先種牧草或去商店買');
  const nm = myName();
  const r = await txView(f => {
    let used = 0, fed = 0; const t = now();
    for (const a of f.ranch.animals) { if (!needFeed(a)) continue; const eat = ANIMALS[a.k].eat; if (used + eat > avail) continue; feedOne(a, t); used += eat; fed++; if (fed >= 3) break; }
    if (!fed) return ab(f.ranch.animals.length ? '好友的動物都吃飽了（或你的飼料不夠）' : '好友還沒有養動物');
    addLog(f, `🌾 ${nm} 幫你餵了 ${fed} 隻動物`); return {used, fed};
  });
  if (r.abort) return toast(r.msg);
  await txMe(f => { useFeed(f, Math.min(r.used, (f.wh.grass || 0) + (f.feed || 0))); return {}; });
  const g = await helpReward('feedf');
  fx3(TROUGH_XZ[0], 1.6, TROUGH_XZ[1], `🌾 幫忙餵了 ${r.fed} 隻 ${g.e ? '+2 經驗' : ''}`, '#8d6e63'); lvToast(g.up);
}
async function cleanPoop(k) {
  const [x, z] = POOP_XZ[k];
  if (isOwn()) { const r = await txMe(f => { if (!(f.ranch.poop > 0)) return ab('已經很乾淨了'); f.ranch.poop--; f.coins += 1; bump(f, 'clean'); return {up:gainExp(f, 1)}; }); if (r.abort) return toast(r.msg); fx3(x, 1, z, '🧹 +1 經驗', '#6d4c41'); lvToast(r.up); return; }
  const nm = myName();
  const r = await txView(f => { if (!(f.ranch.poop > 0)) return ab('已經很乾淨了'); f.ranch.poop--; addLog(f, `🧹 ${nm} 幫你清了便便`); return {}; });
  if (r.abort) return toast(r.msg);
  const g = await helpReward('clean'); fx3(x, 1, z, g.e ? '🧹 幫忙 +2 經驗' : '🧹 幫忙 +1💰', '#6d4c41'); lvToast(g.up);
}

function openModal(title, html) { $('#mt').textContent = title; $('#mb').innerHTML = html; $('#modal').hidden = false; }

function rerenderModal() { if (!$('#modal').hidden && S.modal) { const y = $('#mb').scrollTop; S.modal(); $('#mb').scrollTop = y; } }
const catTabs = (cur, act) => `<div class="cat">${Object.entries(CAT_N).map(([k, n]) => `<button class="${cur === k ? 'on' : ''}" data-act="${act}" data-c="${k}">${n}</button>`).join('')}</div>`;
function seedRows(mode) {
  const f = S.my, Lv = levelOf(f.exp).L;
  return catTabs(S.shopCat, mode === 'pick' ? 'pickCat' : 'shopCat') + Object.entries(CROPS).filter(([, c]) => c.cat === S.shopCat).map(([id, c]) => {
    const lock = Lv < c.lv, have = f.seeds[id] || 0;
    const desc = `成熟 ${fmtDur(c.t * 1000 / SPEED)} · 產量 ${c.y} · 每個 ${c.sell}💰 · +${c.exp} 經驗${id === 'grass' ? '<br>🐄 可以當動物飼料' : ''}`;
    const acts = lock ? `<button class="b g" disabled>Lv.${c.lv} 解鎖</button>`
      : mode === 'pick' ? `<button class="b" data-act="pickSeed" data-id="${id}">${have ? `種這個（有 ${have}）` : `種（${c.cost}💰）`}</button>`
      : `<button class="b o" data-act="buySeed" data-id="${id}" data-n="1">買 1 包 ${c.cost}💰</button><button class="b o" data-act="buySeed" data-id="${id}" data-n="5">買 5 包 ${c.cost * 5}💰</button>`;
    return `<div class="item ${lock ? 'dim' : ''}"><div class="pic">${lock ? '🔒' : icon('crop', id)}</div><div class="info"><div class="t">${c.n}${have ? ` <small style="color:#8d6e63">（庫存 ${have}）</small>` : ''}</div><div class="d">${desc}</div></div><div class="acts">${acts}</div></div>`;

  return `<svg id="wheel" viewBox="-105 -105 210 210"><circle r="104" fill="#8d5a2b"/>${s}<circle r="16" fill="#fff3d6" stroke="#8d5a2b" stroke-width="3"/><text text-anchor="middle" dy="5" font-size="13">🎁</text></svg>`;
}

async function doSpin() {
  const r = await txMe(f => {
    const d = daily(f); if (d.spin) return ab('今天轉過了'); d.spin = true;
    let x = Math.random() * WHEEL.reduce((s, w) => s + w.w, 0), idx = 0; while (x >= WHEEL[idx].w) { x -= WHEEL[idx].w; idx++; }
    const w = WHEEL[idx]; let up = 0, msg = w.t;
    if (w.c) f.coins += w.c; if (w.fert) f.fert = (f.fert || 0) + w.fert; if (w.feed) f.feed = (f.feed || 0) + w.feed; if (w.e) up = gainExp(f, w.e);
    if (w.seed) { const ok = Object.keys(CROPS).filter(k => CROPS[k].lv <= levelOf(f.exp).L); const k = rnd(ok); f.seeds[k] = (f.seeds[k] || 0) + w.seed; msg = `${CROPS[k].n}種子 ×${w.seed}`; }
    return {idx, msg, up};
  });
  if (r.abort) return toast(r.msg);
  const keep = S.modal; S.modal = null; await sleep(30);
  const wheel = $('#wheel'); if (wheel) wheel.style.transform = `rotate(${360 * 6 - (r.idx * 45 + 22.5)}deg)`;
  await sleep(3300); toast(`🎉 轉到了：${r.msg}！`); Music.sfx('coin'); lvToast(r.up); S.modal = keep; rerenderModal();
}

  if (!f && await B.rebuildFarm(u.uid).catch(e => { console.warn(e); return false; })) { f = await B.getFarm(u.uid).catch(() => null); rebuilt = !!f; }
  if (!f) { $('#authErr').textContent = '讀取農場失敗，請再試一次'; await B.logout(); return; }
  S.my = normalize(f); S.seed = null; S.tool = 'hand'; S.scene = 'farm';
  $('#auth').hidden = true; $('#game').hidden = false;
  if (!W.scene) { try { init3D(); } catch (e) { console.error(e); $('#loading').textContent = '😢 你的瀏覽器無法顯示 3D（需要 WebGL），請換 Chrome 或 Safari 試試'; } }
  else setCam('farm', true);
  S.unsubMy = B.watch(S.uid, nf => {
    if (!nf) return; S.my = normalize(nf); if (isOwn()) S.view = S.my;
    const key = (nf.friends || []).join(','); if (key !== S.lastFriendKey) { S.lastFriendKey = key; refreshFriends(); }
    renderAll(); rerenderModal();
  });
  goHome();
  const isNew = !f.lastSign;
  const r = await txMe(g => { let ch = false; if (g.lastSign !== today()) { g.lastSign = today(); g.coins += SIGN_COINS; daily(g); ch = true; } if (fillOrders(g)) ch = true; return ch ? {} : ab(''); }).catch(() => ({abort:1}));
  if (rebuilt) toast('🌱 你的農場資料不見了，已經幫你重新建好一座新農場');
  else if (!r.abort && f.lastSign !== today()) toast(isNew ? '🎉 歡迎來到 3D 農場！先種白蘿蔔和牧草試試看，左上角可以改名字' : `☀️ 每日簽到 +${SIGN_COINS} 金幣，記得看看今天的任務和訂單 📋`);
  refreshFriends();
}
function goHome() { S.unsubView && S.unsubView(); S.unsubView = null; S.viewUid = S.uid; S.view = S.my; S.tool = 'hand'; resetSceneKeys(); renderAll(); beat(); watchHere(); }
function visit(uid) {
  if (uid === S.uid) return goHome();
  S.unsubView && S.unsubView();
  S.viewUid = uid; const fr = S.friends.find(x => x.uid === uid); S.view = fr ? fr.farm : null; S.tool = 'hand'; resetSceneKeys(); renderAll(); beat(); watchHere();
  S.unsubView = B.watch(uid, nf => { if (S.viewUid !== uid) return; S.view = normalize(nf); if (!nf) { toast('找不到這個農場'); return goHome(); } renderScene(); renderTools(); });
  if (!dailyView(S.my).vis.includes(uid)) txMe(f => { const d = daily(f); if (d.vis.includes(uid)) return ab(''); d.vis.push(uid); bump(f, 'visit'); return {}; }).catch(() => {});
}
function resetSceneKeys() { if (!W.scene) return; W.plots.forEach(P => P.key = null); W.aniKey = null; W.petKey = null; }

setInterval(() => { if (S.view) renderScene(); }, 1000);
setInterval(async () => { if (!S.my || S.busy) return; if (tickOwn(normalize(clone(S.my)))) { try { await txMe(f => tickOwn(f) ? {} : ab('')); } catch {} } }, 5000);
setInterval(() => { if (S.my) beat(); }, 25000);
setInterval(() => { if (S.my) refreshFriends(); }, 20000);
setInterval(() => { if (S.my) { renderStrip(); renderTop(); } }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.my) beat(); });

(async () => {
  try { B = USE_FB ? await makeFirebase(FIREBASE_CONFIG) : makeLocal(); }
  catch (e) { $('#authErr').textContent = '無法連上伺服器：' + e.message; return; }
  $('#modeNote').innerHTML = B.mode === 'local' ? '⚠️ 目前是<b>單機測試模式</b>：帳號只存在這台裝置。' : '🌐 連線模式：朋友可以用自己的手機登入一起玩';
  $('#aGo').disabled = false; $('#aGo').textContent = authMode === 'reg' ? '註冊並開始' : '開始種田';
  B.onAuth(u => onAuth(u).catch(e => { console.error(e); toast('出錯了：' + e.message); }));
})();
</script>
