    'auth/invalid-login-credentials':'帳號或密碼錯誤', 'auth/email-already-in-use':'這個帳號已經有人用了', 'auth/weak-password':'密碼至少要 6 個字',

  let regP = null;
  return {
    mode:'firebase',
    onAuth(cb) { A.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid} : null)); },
    async settle() { if (regP) await regP.catch(() => {}); },
    async register(name, pass) { regP = this._register(name, pass); try { await regP; } finally { regP = null; } },
    async _register(name, pass) {
      try {
        const k = nameKey(name);
        if ((await F.getDoc(F.doc(db, 'usernames', k))).exists()) throw new Error('這個帳號已經有人用了');
        const cred = await A.createUserWithEmailAndPassword(auth, email(name), pass);
        try { await F.setDoc(F.doc(db, 'usernames', k), {uid:cred.user.uid}); } catch (e) { await cred.user.delete().catch(() => {}); throw new Error('這個帳號已經有人用了'); }

    async login(name, pass) { try { await A.signInWithEmailAndPassword(auth, email(name), pass); } catch (e) { throw wrap(e); } },
    async logout() { await A.signOut(auth); },

    async listCoops(uid) { const q = await F.getDocs(F.query(F.collection(db, 'coops'), F.where('members', 'array-contains', uid))); return q.docs.map(d => ({id:d.id, ...d.data()})); },
    async createCoop(c) { try { return (await F.addDoc(F.collection(db, 'coops'), c)).id; } catch (e) { throw wrap(e); } },
    async txCoop(id, fn) {
      try { return await F.runTransaction(db, async t => { const r = F.doc(db, 'coops', id), s = await t.get(r); if (!s.exists()) throw new Error('合作訂單不見了'); const d = s.data(), out = fn(d) || {}; if (out.abort) return out; t.update(r, {got:d.got || {}, by:d.by || {}, done:!!d.done, claimed:d.claimed || [], names:d.names || {}}); return out; }); }

const blk = (c, s, p, r) => M(gB(), c, s, p, r);

  const piv = new THREE.Group(); piv.position.y = y; piv.rotation.order = 'YXZ'; piv.rotation.y = ang; piv.rotation.x = -tilt;

function rollGacha(f) {
  const L = levelOf(f.exp).L, okCrops = Object.keys(CROPS).filter(k => CROPS[k].lv <= L), okSea = Object.keys(SEA).filter(k => SEA[k].lv <= L);
  const pets = f.pets.length >= PET_MAX ? [] : Object.keys(PETS).filter(k => PETS[k].lv <= L + 2 && !f.pets.includes(k)), anis = Object.keys(ANIMALS).filter(k => ANIMALS[k].lv <= L);
  const table = [['coin', 30], ['fert', 12], ['feed', 12], ['seed', 14], ['fry', okSea.length ? 12 : 0], ['exp', 10], ['ani', anis.length && f.ranch.animals.length < ranchCap(L) ? 5 : 0], ['pet', pets.length ? 3 : 0], ['big', 2]];
  let x = Math.random() * table.reduce((a, b) => a + b[1], 0), kind = 'coin'; for (const [k, w] of table) { if (x < w) { kind = k; break; } x -= w; }
  if (kind === 'coin') { const n = Math.round(100 + L * 30 + Math.random() * L * 20); f.coins += n; return {t:`💰 ${n} 金幣`, ic:'💰'}; }
  if (kind === 'big') { f.coins += 2000; return {t:'🎊 大獎！💰 2000 金幣', ic:'🎊', rare:true}; }
  if (kind === 'fert') { f.fert = (f.fert || 0) + 3; return {t:'🧪 化肥 ×3', ic:'🧪'}; }
  if (kind === 'feed') { f.feed = (f.feed || 0) + 20; return {t:'🌾 飼料 ×20', ic:'🌾'}; }
  if (kind === 'seed') { const k = rnd(okCrops); f.seeds[k] = (f.seeds[k] || 0) + 5; return {t:`🌱 ${CROPS[k].n}種子 ×5`, kind:'crop', id:k}; }
  if (kind === 'fry') { const k = rnd(okSea); f.fry[k] = (f.fry[k] || 0) + 3; return {t:`🐟 ${SEA[k].n}苗 ×3`, kind:'sea', id:k}; }
  if (kind === 'exp') { const n = 50 + L * 5; gainExp(f, n); return {t:`⭐ ${n} 經驗`, ic:'⭐'}; }
  if (kind === 'ani') { const k = rnd(anis), t = now(); f.ranch.animals.push({k, b:t, p:t, fu:t + ivMs(k) * 2, s:0, th:[]}); return {t:`🎁 免費${ANIMALS[k].n}一隻！`, kind:'ani', id:k, rare:true}; }

}

}

function cleanup() { for (const k of ['unsubMy', 'unsubView', 'unsubHere', 'unsubReq']) { S[k] && S[k](); S[k] = null; } }
async function onAuth(u) {
